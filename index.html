<style>

/* =========================================================
   METIZ PROJECT
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

:root {

    --tiffany: #4cd5d3;

    --background: #050707;
    --background-2: #0b0f0e;

    --text: #ffffff;
    --muted: #9ca7a4;

    --button-dark: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
}


/* =========================================================
   ОСНОВА
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(67,218,193,0.12),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            var(--background),
            var(--background-2)
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   ФОНОВАЯ СЕТКА
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.22;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    z-index: -3;
}


/* =========================================================
   СВЕЧЕНИЕ
========================================================= */

.glow {

    position: fixed;

    width: 420px;
    height: 420px;

    left: 50%;
    top: 35%;

    transform:
        translate(-50%, -50%);

    background:
        var(--tiffany);

    filter:
        blur(180px);

    opacity: 0.07;

    pointer-events: none;

    animation:
        glowMove 8s ease-in-out infinite alternate;

    z-index: -2;
}

@keyframes glowMove {

    from {
        transform:
            translate(-50%, -50%)
            scale(0.9);
    }

    to {
        transform:
            translate(-48%, -53%)
            scale(1.15);
    }
}


/* =========================================================
   КАРТОЧКА
========================================================= */

.card {

    width:
        min(520px, calc(100% - 28px));

    min-height:
        100vh;

    margin:
        auto;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    text-align:
        center;

    padding:
        35px 0;
}


/* =========================================================
   ЛОГОТИП
========================================================= */

.logo-wrap {

    opacity: 0;

    transform:
        translateX(-55px);

    animation:
        enterLogo 0.6s ease forwards;

    animation-delay:
        0.05s;
}

.logo {

    width:
        min(270px, 70vw);

    height:
        auto;

    display:
        block;

    filter:
        drop-shadow(
            0 0 18px
            rgba(67,218,193,0.12)
        );
}

@keyframes enterLogo {

    to {

        opacity: 1;

        transform:
            translateX(0);
    }
}


/* =========================================================
   РАЗДЕЛИТЕЛЬ
========================================================= */

.line {

    width:
        45px;

    height:
        2px;

    margin:
        25px 0 20px;

    background:
        var(--tiffany);

    box-shadow:
        0 0 14px
        rgba(67,218,193,0.5);

    opacity:
        0;

    transform:
        translateX(-45px)
        scaleX(0.7);

    animation:
        enterLine 0.5s ease forwards;

    animation-delay:
        0.12s;
}

@keyframes enterLine {

    to {

        opacity:
            1;

        transform:
            translateX(0)
            scaleX(1);
    }
}


/* =========================================================
   ЗАГОЛОВОК
========================================================= */

.title {

    font-size:
        clamp(25px, 7vw, 38px);

    line-height:
        1.05;

    font-weight:
        800;

    letter-spacing:
        -0.045em;

    opacity:
        0;

    transform:
        translateX(-50px);

    animation:
        enterTitle 0.52s ease forwards;

    animation-delay:
        0.18s;
}

.title span {

    color:
        var(--tiffany);
}

@keyframes enterTitle {

    to {

        opacity:
            1;

        transform:
            translateX(0);
    }
}


/* =========================================================
   ПОДЗАГОЛОВОК
========================================================= */

.subtitle {

    margin-top:
        13px;

    color:
        var(--muted);

    font-size:
        14px;

    line-height:
        1.5;

    max-width:
        380px;

    opacity:
        0;

    transform:
        translateX(-45px);

    animation:
        enterSubtitle 0.52s ease forwards;

    animation-delay:
        0.24s;
}

@keyframes enterSubtitle {

    to {

        opacity:
            1;

        transform:
            translateX(0);
    }
}


/* =========================================================
   КНОПКИ
========================================================= */

.buttons {

    width:
        100%;

    margin-top:
        30px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        10px;
}


/* =========================================================
   КНОПКА
========================================================= */

.button {

    position:
        relative;

    width:
        100%;

    min-height:
        58px;

    padding:
        0 22px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        15px;

    border:
        1px solid var(--border);

    background:
        var(--button-dark);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    color:
        white;

    font-size:
        14px;

    font-weight:
        700;

    text-decoration:
        none;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;

    opacity:
        0;

    transform:
        translateX(-60px);

    animation:
        enterButton 0.5s ease forwards;
}


/* =========================================================
   ПОЯВЛЕНИЕ КНОПОК
========================================================= */

.buttons .button:nth-child(1) {
    animation-delay: 0.30s;
}

.buttons .button:nth-child(2) {
    animation-delay: 0.36s;
}

.buttons .button:nth-child(3) {
    animation-delay: 0.42s;
}

.buttons .button:nth-child(4) {
    animation-delay: 0.48s;
}

.buttons .button:nth-child(5) {
    animation-delay: 0.54s;
}

@keyframes enterButton {

    to {

        opacity:
            1;

        transform:
            translateX(0);
    }
}


/* =========================================================
   ИКОНКИ
========================================================= */

.social-button {

    gap:
        10px;
}

.button-icon {

    width:
        20px;

    height:
        20px;

    flex:
        0 0 20px;

    display:
        block;

    color:
        currentColor;

    transition:
        transform 0.25s ease;
}

.social-button:hover .button-icon {

    transform:
        scale(1.08);
}


/* =========================================================
   ОСНОВНАЯ КНОПКА
========================================================= */

.button.primary {

    background:
        var(--tiffany);

    color:
        #03100d;

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 30px
        rgba(67,218,193,0.12);
}


/* =========================================================
   HOVER
========================================================= */

.button:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 25px
        rgba(67,218,193,0.10);
}

.button.primary:hover {

    background:
        #00eaff;

    box-shadow:
        0 10px 35px
        rgba(67,218,193,0.22);
}


/* =========================================================
   ONLINE
========================================================= */

.status {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    margin-top:
        25px;

    color:
        #37ff00;

    font-size:
        10px;

    letter-spacing:
        0.12em;

    text-transform:
        uppercase;
}

.status-dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #37ff00;

    box-shadow:
        0 0 12px
        #37ff00;

    animation:
        pulse 2s infinite;
}

@keyframes pulse {

    0%,
    100% {

        opacity:
            0.5;

        transform:
            scale(0.8);
    }

    50% {

        opacity:
            1;

        transform:
            scale(1);
    }
}


/* =========================================================
   МАЛЕНЬКАЯ ПОДПИСЬ
========================================================= */

.small {

    margin-top:
        22px;

    color:
        #606b68;

    font-size:
        10px;

    letter-spacing:
        0.16em;

    text-transform:
        uppercase;

    opacity:
        0;

    animation:
        fadeIn 0.8s ease forwards;

    animation-delay:
        0.95s;
}

@keyframes fadeIn {

    to {
        opacity:
            1;
    }
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top:
        auto;

    padding-top:
        35px;

    color:
        #464f4d;

    font-size:
        9px;

    letter-spacing:
        0.16em;

    text-transform:
        uppercase;
}


/* =========================================================
   УХОД СО СТРАНИЦЫ
========================================================= */

body.page-leaving {

    pointer-events:
        none;
}


/* Логотип */

body.page-leaving .logo-wrap {

    animation:
        leaveLogo 0.5s ease forwards;

    animation-delay:
        0s;
}


/* Разделитель */

body.page-leaving .line {

    animation:
        leaveLine 0.45s ease forwards;

    animation-delay:
        0.05s;
}


/* Заголовок */

body.page-leaving .title {

    animation:
        leaveTitle 0.45s ease forwards;

    animation-delay:
        0.10s;
}


/* Подзаголовок */

body.page-leaving .subtitle {

    animation:
        leaveSubtitle 0.45s ease forwards;

    animation-delay:
        0.15s;
}


/* Кнопки */

body.page-leaving .buttons .button {

    animation:
        leaveButton 0.45s ease forwards;
}


/* Каскад сверху вниз */

body.page-leaving .buttons .button:nth-child(1) {
    animation-delay: 0.20s;
}

body.page-leaving .buttons .button:nth-child(2) {
    animation-delay: 0.27s;
}

body.page-leaving .buttons .button:nth-child(3) {
    animation-delay: 0.34s;
}

body.page-leaving .buttons .button:nth-child(4) {
    animation-delay: 0.41s;
}

body.page-leaving .buttons .button:nth-child(5) {
    animation-delay: 0.48s;
}


/* Online */

body.page-leaving .status {

    animation:
        leaveSmall 0.4s ease forwards;

    animation-delay:
        0.50s;
}


/* Маленькая подпись */

body.page-leaving .small {

    animation:
        leaveSmall 0.4s ease forwards;

    animation-delay:
        0.54s;
}


/* =========================================================
   АНИМАЦИИ УХОДА
========================================================= */

@keyframes leaveLogo {

    to {

        opacity:
            0;

        transform:
            translateX(-90px);
    }
}

@keyframes leaveLine {

    to {

        opacity:
            0;

        transform:
            translateX(-65px)
            scaleX(0.7);
    }
}

@keyframes leaveTitle {

    to {

        opacity:
            0;

        transform:
            translateX(-75px);
    }
}

@keyframes leaveSubtitle {

    to {

        opacity:
            0;

        transform:
            translateX(-65px);
    }
}

@keyframes leaveButton {

    to {

        opacity:
            0;

        transform:
            translateX(-110px);
    }
}

@keyframes leaveSmall {

    to {

        opacity:
            0;

        transform:
            translateX(-45px);
    }
}


/* =========================================================
   МОБИЛЬНЫЕ
========================================================= */

@media (max-width: 500px) {

    .card {

        width:
            calc(100% - 30px);

        padding:
            28px 0;
    }

    .logo {

        width:
            230px;
    }

    .title {

        font-size:
            27px;
    }

    .subtitle {

        font-size:
            13px;
    }

    .button {

        min-height:
            56px;

        border-radius:

    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;
    }
}

</style>

<script>

/* =========================================================
   ПЕРЕХОД НА TEST.HTML
========================================================= */

const pageLink =
    document.querySelector(".page-link");

let isLeaving =
    false;


if (pageLink) {

    pageLink.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            if (isLeaving) {
                return;
            }

            isLeaving = true;

            const url =
                this.href;

            document.body.classList.add(
                "page-leaving"
            );

            /*
             * Последняя кнопка:
             * delay 0.48s
             * duration 0.45s
             *
             * Полный каскад заканчивается
             * примерно через 0.93 секунды.
             */

            setTimeout(
                function() {

                    window.location.href =
                        url;

                },
                1000
            );

        }
    );

}


/* =========================================================
   НАШИ РАБОТЫ
========================================================= */

const worksLink =
    document.querySelector(".works-link");


if (worksLink) {

    worksLink.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            if (isLeaving) {
                return;
            }

            alert(
                "Раздел «Наши работы» скоро будет доступен."
            );

        }
    );

}


/* =========================================================
   BFCache
========================================================= */

window.addEventListener(
    "pageshow",
    function() {

        isLeaving =
            false;

        document.body.classList.remove(
            "page-leaving"
        );

    }
);

</script>
