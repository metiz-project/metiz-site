<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<!-- =========================================================
     НАСТРОЙКИ ОТОБРАЖЕНИЯ
     Страница адаптирована под телефон и компьютер
     ========================================================= -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Запрещаем браузеру самовольно менять цветовую схему -->
<meta name="color-scheme" content="only light">

<title>METIZ PROJECT</title>

<style>

/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ ЦВЕТОВ
   Здесь можно менять основные цвета сайта
   ========================================================= */

:root {

    /* =====================================================
       ЦВЕТ КНОПОК
       Основной Tiffany-цвет сайта
       ===================================================== */
    --tiffany: #4cd5d3;


    /* =====================================================
       НАЧАЛО ЦВЕТА ГРАДИЕНТА
       Цвет начинается от верхнего левого угла
       ===================================================== */
    --background: #050707;


    /* =====================================================
       КОНЕЦ ЦВЕТА ГРАДИЕНТА
       Цвет заканчивается в нижнем правом углу
       ===================================================== */
    --background-2: #0b0f0e;


    /* =====================================================
       ЦВЕТ ЗАГОЛОВКА И ОСНОВНОГО ТЕКСТА
       ===================================================== */
    --text: #ffffff;


    /* =====================================================
       ЦВЕТ ВТОРОСТЕПЕННОГО ТЕКСТА
       Здесь находится описание под главным заголовком
       ===================================================== */
    --muted: #9ca7a4;


    /* =====================================================
       ТЁМНЫЙ ФОН ОБЫЧНЫХ КНОПОК
       ===================================================== */
    --button-dark: rgba(255,255,255,0.06);


    /* =====================================================
       ЦВЕТ РАМКИ ОБЫЧНЫХ КНОПОК
       ===================================================== */
    --border: rgba(255,255,255,0.12);



    /* =====================================================
       НАСТРОЙКИ НОВОГО ЭФФЕКТА
       «ЖИВОЙ TIFFANY»

       Здесь можно будет самостоятельно менять:

       --live-light-size
       размер светящегося пятна

       --live-light-opacity
       силу свечения

       --live-light-speed
       скорость движения

       ===================================================== */

    --live-light-size: 430px;

    --live-light-opacity: 0.085;

    --live-light-speed: 18s;

}


/* =========================================================
   ОСНОВНОЙ BODY
   ========================================================= */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(67,218,193,0.12),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            var(--background),
            var(--background-2)
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

    color-scheme: only light;
}


/* =========================================================
   ФОНОВАЯ СЕТКА

   Очень лёгкая техническая сетка.
   Она практически незаметна, но добавляет глубину.
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    opacity: 0.25;

    z-index: 0;
}


/* =========================================================
   НОВЫЙ ЖИВОЙ TIFFANY-СВЕТ

   Это главный новый эффект.

   Свет медленно перемещается за содержимым страницы.
   Он не должен мешать логотипу и кнопкам.

   ВАЖНО:
   Мы двигаем сам элемент через transform.
   Это легче для браузера, чем постоянно менять
   top / left / width / height.

   ========================================================= */

/* =========================================================
   ЖИВОЙ TIFFANY-СВЕТ — УСИЛЕННАЯ ВЕРСИЯ

   Два световых облака медленно двигаются по фону.
   
   ОБЛАКО №1 — основной Tiffany-свет
   ОБЛАКО №2 — дополнительный свет для глубины

   Здесь специально сделано ярче предыдущей версии,
   чтобы эффект был хорошо заметен на телефоне.
   ========================================================= */


/* =========================================================
   ОСНОВНОЕ TIFFANY-СВЕЧЕНИЕ
   ========================================================= */

.glow {

    position: fixed;

    width: 520px;
    height: 520px;

    left: 50%;
    top: 35%;

    transform:
        translate(-50%, -50%)
        translate3d(-120px, -70px, 0);

    border-radius: 50%;

    pointer-events: none;

    z-index: 0;

    background:
        radial-gradient(
            circle,
            rgba(76, 213, 211, 0.30) 0%,
            rgba(76, 213, 211, 0.16) 25%,
            rgba(76, 213, 211, 0.07) 45%,
            rgba(76, 213, 211, 0.02) 62%,
            transparent 76%
        );

    filter:
        blur(45px);

    opacity: 0.9;

    will-change:
        transform,
        opacity;

    animation:
        liveTiffanyMain
        14s
        ease-in-out
        infinite alternate;

}


/* =========================================================
   ВТОРОЕ TIFFANY-СВЕЧЕНИЕ

   Оно движется в противоположную сторону.
   Благодаря этому фон будет выглядеть более живым.
   ========================================================= */

body::after {

    content: "";

    position: fixed;

    width: 430px;
    height: 430px;

    right: -120px;
    bottom: -80px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 0;

    background:
        radial-gradient(
            circle,
            rgba(76, 213, 211, 0.22) 0%,
            rgba(76, 213, 211, 0.10) 28%,
            rgba(76, 213, 211, 0.04) 48%,
            transparent 72%
        );

    filter:
        blur(50px);

    opacity: 0.85;

    will-change:
        transform,
        opacity;

    animation:
        liveTiffanySecond
        17s
        ease-in-out
        infinite alternate;

}


/* =========================================================
   ДВИЖЕНИЕ ПЕРВОГО СВЕТА
   ========================================================= */

@keyframes liveTiffanyMain {

    0% {

        transform:
            translate(-50%, -50%)
            translate3d(-150px, -90px, 0)
            scale(0.88);

        opacity: 0.65;

    }


    25% {

        transform:
            translate(-50%, -50%)
            translate3d(20px, -130px, 0)
            scale(1.05);

        opacity: 0.90;

    }


    50% {

        transform:
            translate(-50%, -50%)
            translate3d(150px, -20px, 0)
            scale(1.15);

        opacity: 1;

    }


    75% {

        transform:
            translate(-50%, -50%)
            translate3d(70px, 100px, 0)
            scale(1.02);

        opacity: 0.82;

    }


    100% {

        transform:
            translate(-50%, -50%)
            translate3d(-130px, 80px, 0)
            scale(0.94);

        opacity: 0.72;

    }

}


/* =========================================================
   ДВИЖЕНИЕ ВТОРОГО СВЕТА
   ========================================================= */

@keyframes liveTiffanySecond {

    0% {

        transform:
            translate3d(80px, 40px, 0)
            scale(0.85);

        opacity: 0.55;

    }


    50% {

        transform:
            translate3d(-120px, -100px, 0)
            scale(1.12);

        opacity: 0.95;

    }


    100% {

        transform:
            translate3d(-220px, 60px, 0)
            scale(0.92);

        opacity: 0.65;

    }

}


/* =========================================================
   МОБИЛЬНАЯ ВЕРСИЯ

   На телефоне уменьшаем размеры свечения,
   но оставляем его достаточно ярким.
   ========================================================= */

@media (max-width: 500px) {

    .glow {

        width: 390px;
        height: 390px;

        filter:
            blur(38px);

    }


    body::after {

        width: 330px;
        height: 330px;

        filter:
            blur(40px);

    }

}


/* =========================================================
   УМЕНЬШЕНИЕ АНИМАЦИИ

   Если пользователь включил системное
   «Уменьшение движения», свет остаётся,
   но перестаёт двигаться.
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .glow,
    body::after {

        animation: none;

    }

}


/* =========================================================
   ОСНОВНАЯ КАРТОЧКА

   Весь контент находится поверх фоновых эффектов.
   ========================================================= */

.card {

    position: relative;

    z-index: 2;

    width: min(
        520px,
        calc(100% - 28px)
    );

    min-height: 100vh;

    margin: 0 auto;

    box-sizing: border-box;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

}


/* =========================================================
   ЛОГОТИП
   ========================================================= */

.logo-wrap {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    animation:
        logoAppear
        0.9s
        ease-out
        both;

}


/* =========================================================
   САМО ИЗОБРАЖЕНИЕ ЛОГОТИПА

   ОРИГИНАЛЬНЫЙ ЛОГОТИП НЕ ИЗМЕНЯЕМ.
   ========================================================= */

.logo {

    width: min(
        270px,
        70vw
    );

    height: auto;

    display: block;

    filter:
        drop-shadow(
            0 0 12px
            rgba(76,213,211,0.18)
        );

}


/* =========================================================
   АНИМАЦИЯ ПОЯВЛЕНИЯ ЛОГОТИПА
   ========================================================= */

@keyframes logoAppear {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   РАЗДЕЛИТЕЛЬНАЯ ЛИНИЯ
   ========================================================= */

.line {

    width: 45px;

    height: 2px;

    margin:
        25px 0
        20px;

    background:
        var(--tiffany);

    box-shadow:
        0 0 10px
        rgba(76,213,211,0.35);

    animation:
        lineAppear
        1s
        ease-out
        both;

}


/* =========================================================
   АНИМАЦИЯ ЛИНИИ
   ========================================================= */

@keyframes lineAppear {

    from {

        opacity: 0;

        transform:
            scaleX(0);

    }

    to {

        opacity: 1;

        transform:
            scaleX(1);

    }

}


/* =========================================================
   ГЛАВНЫЙ ЗАГОЛОВОК
   ========================================================= */

.title {

    margin: 0;

    padding: 0;

    font-size:
        clamp(
            25px,
            7vw,
            38px
        );

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -0.7px;

}


/* =========================================================
   TIFFANY-ЧАСТЬ ЗАГОЛОВКА
   ========================================================= */

.title span {

    color: var(--tiffany);

}


/* =========================================================
   ОПИСАНИЕ

   Здесь используется цвет --muted.
   ========================================================= */

.subtitle {

    margin-top: 13px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.45;

}


/* =========================================================
   БЛОК КНОПОК
   ========================================================= */

.buttons {

    width: 100%;

    margin-top: 30px;

    display: flex;

    flex-direction: column;

    gap: 10px;

    animation:
        buttonsAppear
        1s
        0.15s
        ease-out
        both;

}


/* =========================================================
   ОБЩИЙ ВИД КНОПОК
   ========================================================= */

.button {

    position: relative;

    min-height: 58px;

    padding:
        0 22px;

    box-sizing: border-box;

    border-radius: 15px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-dark);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    color: #ffffff;

    text-decoration: none;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    font-weight: 700;

    transition:
        transform 0.2s ease,
        filter 0.2s ease,
        border-color 0.2s ease;

    overflow: hidden;

}


/* =========================================================
   ГЛАВНАЯ TIFFANY-КНОПКА
   ========================================================= */

.button.primary {

    background:
        var(--tiffany);

    color: #03100d;

    border-color:
        var(--tiffany);

    box-shadow:
        0 0 18px
        rgba(76,213,211,0.20);

}


/* =========================================================
   НАВЕДЕНИЕ НА ОБЫЧНУЮ КНОПКУ
   ========================================================= */

.button:hover {

    border-color:
        var(--tiffany);

    transform:
        translateY(-1px);

}


/* =========================================================
   НАВЕДЕНИЕ НА TIFFANY-КНОПКУ
   ========================================================= */

.button.primary:hover {

    background:
        #00eaff;

    border-color:
        #00eaff;

}


/* =========================================================
   НАЖАТИЕ НА КНОПКУ
   ========================================================= */

.button:active {

    transform:
        scale(0.98);

}


/* =========================================================
   АНИМАЦИЯ ПОЯВЛЕНИЯ КНОПОК
   ========================================================= */

@keyframes buttonsAppear {

    from {

        opacity: 0;

        transform:
            translateY(12px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   МАЛЕНЬКАЯ ПОДПИСЬ
   ========================================================= */

.small {

    margin-top: 22px;

    color: #606b68;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;

}


/* =========================================================
   СТАТУС ONLINE
   ========================================================= */

.status {

    margin-top: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    color: #37ff00;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;

}


/* =========================================================
   ТОЧКА ONLINE
   ========================================================= */

.status-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background:
        #37ff00;

    box-shadow:
        0 0 8px
        #37ff00;

    animation:
        statusPulse
        1.8s
        ease-in-out
        infinite;

}


/* =========================================================
   ПУЛЬСАЦИЯ ONLINE
   ========================================================= */

@keyframes statusPulse {

    0%,
    100% {

        opacity: 0.55;

        transform:
            scale(0.9);

    }

    50% {

        opacity: 1;

        transform:
            scale(1.15);

    }

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    margin-top: auto;

    padding-top: 35px;

    padding-bottom: 22px;

    color: #464f4d;

    font-size: 9px;

    letter-spacing: 1px;

    text-transform: uppercase;

}


/* =========================================================
   МОБИЛЬНАЯ ВЕРСИЯ
   ========================================================= */

@media (max-width: 500px) {

    .card {

        width:
            calc(100% - 30px);

        padding:
            28px 0;

    }


    .logo {

        width:
            230px;

    }


    .title {

        font-size:
            27px;

    }


    .subtitle {

        font-size:
            13px;

    }


    .button {

        min-height:
            56px;

        border-radius:
            14px;

    }


    /* ================================================
       ЖИВОЙ TIFFANY НА ТЕЛЕФОНЕ

       Немного уменьшаем размер свечения,
       чтобы эффект оставался аккуратным.
       ================================================ */

    .live-light {

        width:
            360px;

        height:
            360px;

        filter:
            blur(32px);

    }

}


/* =========================================================
   УМЕНЬШЕНИЕ АНИМАЦИЙ

   Если на устройстве включено «Уменьшение движения»,
   большая часть движения автоматически отключается.

   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .live-light {

        animation:
            none;

        transform:
            translate(-50%, -50%);

        opacity:
            0.65;

    }


    .status-dot {

        animation:
            none;

    }


    .logo-wrap,
    .line,
    .buttons {

        animation:
            none;

    }

}


/* =========================================================
   ЗАВЕРШЕНИЕ CSS
   ========================================================= */

</style>
</head>


<body>


<!-- =========================================================
     ЖИВОЙ TIFFANY-СВЕТ

     Этот элемент находится за всем содержимым страницы.

     Он НЕ является кнопкой.
     Он НЕ влияет на работу сайта.
     Это только визуальный эффект.

     ========================================================= -->

<div class="live-light"></div>


<!-- =========================================================
     ОСНОВНАЯ КАРТОЧКА
     ========================================================= -->

<main class="card">


    <!-- =====================================================
         ЛОГОТИП
         Используется оригинальный файл METIZ PROJECT
         ===================================================== -->

    <div class="logo-wrap">

        <img
            class="logo"
            src="metiz-project-logo.png"

        >

    </div>


    <!-- =====================================================
         РАЗДЕЛИТЕЛЬ
         ===================================================== -->

         ГЛАВНЫЙ ЗАГОЛОВОК
         ===================================================== -->

        <span>
            под ваши задачи
        </span>

    </h1>

         ОПИСАНИЕ
         ===================================================== -->

    <div class="subtitle">

        Наклейки • Печать • Плоттерная резка

    </div>


    <!-- =====================================================
         КНОПКИ
         ===================================================== -->

    <div class="buttons">


        <!-- =================================================

            class="button primary"

        <!-- =================================================
             НАПИСАТЬ ВКОНТАКТЕ

        >

            Написать в Telegram

        </a>


        <!-- =================================================
             WHATSAPP

        <a
            class="button primary"

            target="_blank"
            rel="noopener noreferrer"

    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

    </footer>


</main>

   Позже здесь сделаем настоящий переход

   ========================================================= */

    event.preventDefault();

    alert(
        'Раздел «Наши работы» скоро будет доступен.'
    );

}

</script>
