<!DOCTYPE html>
<html lang="ru">

<head>

    <!-- =========================================================
         METIZ PROJECT — DIGITAL BUSINESS CARD
         =========================================================
         ВАЖНО:
         Этот файл можно полностью заменить новым кодом.
         Все основные настройки находятся в начале CSS,
         чтобы их было легко находить и менять.
         ========================================================= -->

    <meta charset="UTF-8">

    <!-- Правильное отображение на телефонах -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>METIZ PROJECT</title>

    <style>

        /* =========================================================
           ОСНОВНЫЕ НАСТРОЙКИ ЦВЕТОВ
           ========================================================= */

        :root {

            /* ЦВЕТ КНОПОК */
            --tiffany: #4cd5d3;

            /* НАЧАЛО ЦВЕТА ГРАДИЕНТА
               ОТ ВЕРХНЕГО ЛЕВОГО УГЛА */
            --background: #050707;

            /* КОНЕЦ ЦВЕТА ГРАДИЕНТА
               В НИЖНЕМ ПРАВОМ УГЛУ */
            --background-2: #0b0f0e;

            /* ЦВЕТ ЗАГОЛОВКА И ОСНОВНОГО ТЕКСТА */
            --text: #ffffff;

            /* ЦВЕТ ВТОРОСТЕПЕННОГО ТЕКСТА */
            --muted: #9ca7a4;

            /* ТЁМНЫЙ ЦВЕТ ОБЫЧНЫХ КНОПОК */
            --button-dark: rgba(255,255,255,0.06);

            /* ЦВЕТ ОБВОДКИ */
            --border: rgba(255,255,255,0.12);
        }


        /* =========================================================
           СБРОС СТАНДАРТНЫХ СТИЛЕЙ БРАУЗЕРА
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           ОСНОВНАЯ СТРАНИЦА
           ========================================================= */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            position: relative;

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:

                /* =================================================
                   ЖИВОЙ TIFFANY — ОСНОВНОЕ СВЕЧЕНИЕ
                   ================================================= */

                radial-gradient(
                    circle at 50% 35%,
                    rgba(67,218,193,0.14),
                    transparent 34%
                ),

                /* ОСНОВНОЙ ТЁМНЫЙ ГРАДИЕНТ */
                linear-gradient(
                    145deg,
                    var(--background),
                    var(--background-2)
                );

            /* Не даём браузеру самопроизвольно менять цвета */
            color-scheme: only light;
        }


        /* =========================================================
           ФОНОВАЯ СЕТКА
           =========================================================
           Это очень тонкая технологическая сетка.
           Её почти не видно, но она добавляет глубину.
           ========================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(76,213,211,0.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(76,213,211,0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            opacity: 0.5;
        }


        /* =========================================================
           ЖИВОЙ TIFFANY — СВЕТ №1
           =========================================================
           Большое мягкое пятно света.
           Движется медленно.
           ========================================================= */

        .tiffany-light-1 {

            position: fixed;

            width: 430px;
            height: 430px;

            left: -160px;
            top: 5%;

            z-index: 0;

            pointer-events: none;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(76,213,211,0.24) 0%,
                    rgba(76,213,211,0.13) 28%,
                    rgba(76,213,211,0.045) 52%,
                    transparent 72%
                );

            filter: blur(35px);

            opacity: 0.9;

            animation:
                tiffanyFloatOne
                18s
                ease-in-out
                infinite
                alternate;

            will-change: transform, opacity;
        }


        /* =========================================================
           ЖИВОЙ TIFFANY — СВЕТ №2
           =========================================================
           Второй источник света идёт в противоположную сторону.
           Благодаря этому фон не выглядит статичным.
           ========================================================= */

        .tiffany-light-2 {

            position: fixed;

            width: 500px;
            height: 500px;

            right: -210px;
            bottom: 0;

            z-index: 0;

            pointer-events: none;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(76,213,211,0.21) 0%,
                    rgba(76,213,211,0.11) 28%,
                    rgba(76,213,211,0.035) 52%,
                    transparent 72%
                );

            filter: blur(45px);

            opacity: 0.85;

            animation:
                tiffanyFloatTwo
                22s
                ease-in-out
                infinite
                alternate;

            will-change: transform, opacity;
        }


        /* =========================================================
           АНИМАЦИЯ СВЕТА №1
           ========================================================= */

        @keyframes tiffanyFloatOne {

            0% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);
            }

            50% {

                transform:
                    translate3d(
                        230px,
                        110px,
                        0
                    )
                    scale(1.15);
            }

            100% {

                transform:
                    translate3d(
                        80px,
                        300px,
                        0
                    )
                    scale(0.95);
            }
        }


        /* =========================================================
           АНИМАЦИЯ СВЕТА №2
           ========================================================= */

        @keyframes tiffanyFloatTwo {

            0% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);
            }

            50% {

                transform:
                    translate3d(
                        -210px,
                        -150px,
                        0
                    )
                    scale(1.12);
            }

            100% {

                transform:
                    translate3d(
                        -60px,
                        -300px,
                        0
                    )
                    scale(0.94);
            }
        }


        /* =========================================================
           ДОПОЛНИТЕЛЬНЫЙ МЯГКИЙ GLOW
           ========================================================= */

        .glow {

            position: fixed;

            width: 420px;
            height: 420px;

            left: 50%;
            top: 40%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 0;

            pointer-events: none;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(76,213,211,0.075),
                    transparent 68%
                );

            filter: blur(80px);

            animation:
                centerGlow
                12s
                ease-in-out
                infinite
                alternate;
        }


        /* =========================================================
           АНИМАЦИЯ ЦЕНТРАЛЬНОГО GLOW
           ========================================================= */

        @keyframes centerGlow {

            0% {

                opacity: 0.45;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0.92);
            }

            100% {

                opacity: 0.85;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.12);
            }
        }


        /* =========================================================
           ОСНОВНАЯ КАРТОЧКА
           ========================================================= */

        .card {

            position: relative;

            z-index: 2;

            width:
                min(
                    520px,
                    calc(100% - 28px)
                );

            min-height: 100vh;

            margin: 0 auto;

            padding:
                42px 0
                28px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =========================================================
           ЛОГОТИП
           ========================================================= */

        .logo-wrap {

            width: 100%;

            display: flex;

            justify-content: center;

            animation:
                logoAppear
                0.9s
                ease
                both;
        }


        .logo {

            width:
                min(
                    270px,
                    70vw
                );

            height: auto;

            display: block;

            /*
             ВАЖНО:
             ЛОГОТИП НЕ ПЕРЕКРАШИВАЕМ.

             Используется оригинальный файл:
             metiz-project-logo.png
            */

            filter:
                drop-shadow(
                    0 0 16px
                    rgba(76,213,211,0.18)
                );
        }


        /* =========================================================
           ПОЯВЛЕНИЕ ЛОГОТИПА
           ========================================================= */

        @keyframes logoAppear {

            from {

                opacity: 0;

                transform:
                    translateY(-14px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================================
           ЛИНИЯ ПОД ЛОГОТИПОМ
           ========================================================= */

        .line {

            width: 45px;

            height: 2px;

            margin:
                25px 0
                20px;

            background:
                #4cd5d3;

            border-radius: 10px;

            box-shadow:
                0 0 12px
                rgba(76,213,211,0.55);

            animation:
                lineAppear
                1s
                ease
                0.2s
                both;
        }


        @keyframes lineAppear {

            from {

                opacity: 0;

                transform:
                    scaleX(0);
            }

            to {

                opacity: 1;

                transform:
                    scaleX(1);
            }
        }


        /* =========================================================
           ГЛАВНЫЙ ЗАГОЛОВОК
           ========================================================= */

        .title {

            font-size:
                clamp(
                    25px,
                    7vw,
                    38px
                );

            line-height: 1.05;

            font-weight: 800;

            letter-spacing: -0.8px;

            animation:
                titleAppear
                0.9s
                ease
                0.25s
                both;
        }


        /* ВТОРАЯ СТРОКА ЗАГОЛОВКА — TIFFANY */

        .title span {

            color:
                #4cd5d3;
        }


        /* =========================================================
           ПОЯВЛЕНИЕ ЗАГОЛОВКА
           ========================================================= */

        @keyframes titleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           ПОДЗАГОЛОВОК
           ========================================================= */

        .subtitle {

            margin-top: 13px;

            color:
                var(--muted);

            font-size: 13px;

            line-height: 1.5;

            animation:
                subtitleAppear
                0.9s
                ease
                0.35s
                both;
        }


        @keyframes subtitleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           БЛОК КНОПОК
           ========================================================= */

        .buttons {

            width: 100%;

            margin-top: 30px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            animation:
                buttonsAppear
                0.9s
                ease
                0.45s
                both;
        }


        @keyframes buttonsAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           ОБЩАЯ КНОПКА
           ========================================================= */

        .button {

            position: relative;

            min-height: 58px;

            padding:
                0 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 15px;

            border:
                1px solid
                var(--border);

            background:
                var(--button-dark);

            color:
                #ffffff;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.1px;

            overflow: hidden;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            transition:
                transform
                0.22s
                ease,

                box-shadow
                0.22s
                ease,

                border-color
                0.22s
                ease;
        }


        /* =========================================================
           ОСНОВНЫЕ ЯРКИЕ TIFFANY-КНОПКИ
           ========================================================= */

        .button.primary {

            background:
                #4cd5d3;

            color:
                #03100d;

            border-color:
                #4cd5d3;

            box-shadow:
                0 8px 24px
                rgba(76,213,211,0.18);
        }


        /* =========================================================
           ЭФФЕКТ ПРИ НАВЕДЕНИИ
           ========================================================= */

        .button:hover {

            border-color:
                var(--tiffany);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 28px
                rgba(76,213,211,0.14);
        }


        /* =========================================================
           ЭФФЕКТ НАЖАТИЯ
           ========================================================= */

        .button:active {

            transform:
                translateY(1px)
                scale(0.99);
        }


        /* =========================================================
           НАВЕДЕНИЕ НА ЯРКУЮ КНОПКУ
           ========================================================= */

        .button.primary:hover {

            background:
                #00eaff;

            border-color:
                #00eaff;

            box-shadow:
                0 10px 34px
                rgba(0,234,255,0.25);
        }


        /* =========================================================
           НЕБОЛЬШОЙ ТЕКСТ ПОД КНОПКАМИ
           ========================================================= */

        .small {

            margin-top: 22px;

            color:
                #606b68;

            font-size: 10px;

            line-height: 1.4;

            text-transform: uppercase;

            letter-spacing: 1.2px;
        }


        /* =========================================================
           СТАТУС ONLINE
           ========================================================= */

        .status {

            margin-top: 25px;

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                #37ff00;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* ЗЕЛЁНАЯ ТОЧКА ONLINE */

        .status-dot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background:
                #37ff00;

            box-shadow:
                0 0 10px
                rgba(55,255,0,0.8);

            animation:
                onlinePulse
                1.8s
                ease-in-out
                infinite;
        }


        /* =========================================================
           АНИМАЦИЯ ONLINE
           ========================================================= */

        @keyframes onlinePulse {

            0%,
            100% {

                opacity: 1;

                transform:
                    scale(1);
            }

            50% {

                opacity: 0.45;

                transform:
                    scale(0.75);
            }
        }


        /* =========================================================
           НИЖНИЙ FOOTER
           ========================================================= */

        .footer {

            margin-top: auto;

            padding-top: 35px;

            color:
                #464f4d;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.8px;
        }


        /* =========================================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ========================================================= */

        @media (max-width: 500px) {

            .card {

                width:
                    calc(100% - 30px);

                padding:
                    28px 0;
            }


            .logo {

                width: 230px;
            }


            .title {

                font-size: 27px;
            }


            .subtitle {

                font-size: 13px;
            }


            .button {

                min-height: 56px;

                border-radius: 14px;
            }


            /*
             На маленьких экранах свет немного уменьшаем,
             чтобы он не забивал содержимое.
            */

            .tiffany-light-1 {

                width: 360px;
                height: 360px;

                opacity: 0.72;
            }


            .tiffany-light-2 {

                width: 380px;
                height: 380px;

                opacity: 0.68;
            }


            .glow {

                width: 340px;
                height: 340px;
            }
        }


        /* =========================================================
           ЕСЛИ У ПОЛЬЗОВАТЕЛЯ В СИСТЕМЕ ВКЛЮЧЕНО
           "УМЕНЬШЕНИЕ ДВИЖЕНИЯ"

           Тогда анимации автоматически отключаются.
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;

                scroll-behavior: auto !important;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         ЖИВОЙ TIFFANY — СВЕТОВЫЕ СЛОИ
         =========================================================
         Эти элементы отвечают только за движение света
         на заднем фоне.

         ЛОГОТИП ОНИ НЕ ЗАТРАГИВАЮТ.
         ========================================================= -->

    <div class="tiffany-light-1"></div>

    <div class="tiffany-light-2"></div>

    <div class="glow"></div>


    <!-- =========================================================
         ОСНОВНАЯ КАРТОЧКА
         ========================================================= -->

    <main class="card">


        <!-- =====================================================
             ЛОГОТИП
             ===================================================== -->

        <div class="logo-wrap">

            <img
                class="logo"
                src="metiz-project-logo.png"
                alt="METIZ PROJECT"
            >

        </div>


        <!-- =====================================================
             РАЗДЕЛИТЕЛЬНАЯ ЛИНИЯ
             ===================================================== -->

        <div class="line"></div>


        <!-- =====================================================
             ГЛАВНЫЙ ЗАГОЛОВОК
             ===================================================== -->

        <h1 class="title">

            Печатаем и режем

            <br>

            <span>под ваши задачи</span>

        </h1>


        <!-- =====================================================
             ПОДЗАГОЛОВОК

             Здесь можно менять текст описания.
             ===================================================== -->

        <p class="subtitle">

            Наклейки • Печать • Плоттерная резка

        </p>


        <!-- =====================================================
             КНОПКИ

             Здесь находятся основные действия пользователя.
             ===================================================== -->

        <div class="buttons">


            <!-- =================================================
                 КНОПКА 1 — ГРУППА ВКОНТАКТЕ
                 ================================================= -->

            <a
                class="button primary"
                href="https://vk.ru/metiz_project"
                target="_blank"
                rel="noopener"
            >

                Группа ВКонтакте

            </a>


            <!-- =================================================
                 КНОПКА 2 — НАПИСАТЬ ВКОНТАКТЕ
                 ================================================= -->

            <a
                class="button primary"
                href="https://vk.ru/im?sel=-10150150"
                target="_blank"
                rel="noopener"
            >

                Написать ВКонтакте

            </a>


            <!-- =================================================
                 КНОПКА 3 — TELEGRAM
                 ================================================= -->

            <a
                class="button primary"
                href="https://t.me/metizproject"
                target="_blank"
                rel="noopener"
            >

                Написать в Telegram

            </a>


            <!-- =================================================
                 КНОПКА 4 — WHATSAPP
                 ================================================= -->

            <a
                class="button primary"
                href="https://wa.me/message/RDHE3F4PU2D3L1"
                target="_blank"
                rel="noopener"
            >

                Написать в WhatsApp

            </a>


            <!-- =================================================
                 КНОПКА 5 — НАШИ РАБОТЫ
                 ================================================= -->

            <a
                class="button"
                href="#"
                onclick="openWorks(event)"
            >

                Посмотреть наши работы →

            </a>


        </div>


        <!-- =====================================================
             НЕБОЛЬШАЯ ПОДПИСЬ
             ===================================================== -->

        <div class="small">

            Stickers / Print / Branding

        </div>


        <!-- =====================================================
             СТАТУС
             ===================================================== -->

        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <div class="footer">

            © METIZ PROJECT 2010-2026

        </div>


    </main>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /* =======================================================
           КНОПКА "НАШИ РАБОТЫ"

           Пока отдельная страница ещё не создана,
           поэтому показываем сообщение.

           Позже здесь сделаем настоящий переход
           на раздел с работами.
           ======================================================= */

        function openWorks(event) {

            event.preventDefault();

            alert(
                "Раздел «Наши работы» скоро будет доступен."
            );
        }


    </script>


</body>

</html>
