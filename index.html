<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>METIZ PROJECT</title>

<meta
    name="description"
    content="METIZ PROJECT — наклейки, печать, плоттерная резка и брендирование автомобилей."
>


<style>

/* =========================================================
   METIZ PROJECT
   НАСТРОЙКИ
========================================================= */

:root {

    --tiffany: #4cd5d3;

    --background: #050707;

    --background-2: #0b0f0e;

    --text: #ffffff;

    --muted: #9ca7a4;

    --button-dark: rgba(255,255,255,0.06);

    --border: rgba(255,255,255,0.12);

}


/* =========================================================
   ОСНОВА
========================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(67,218,193,0.12),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            var(--background),
            var(--background-2)
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

}


/* =========================================================
   ФОНОВАЯ СЕТКА
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.22;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:

        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    z-index: -3;

}


/* =========================================================
   TIFFANY СВЕЧЕНИЕ
========================================================= */

.glow {

    position: fixed;

    width: 420px;

    height: 420px;

    left: 50%;

    top: 35%;

    transform:
        translate(-50%, -50%);

    background: var(--tiffany);

    filter: blur(180px);

    opacity: 0.07;

    pointer-events: none;

    animation:
        glowMove 8s ease-in-out infinite alternate;

    z-index: -2;

}


@keyframes glowMove {

    from {

        transform:
            translate(-50%, -50%)
            scale(0.9);

    }

    to {

        transform:
            translate(-48%, -53%)
            scale(1.15);

    }

}


/* =========================================================
   ВИЗИТКА
========================================================= */

.card {

    width:
        min(
            520px,
            calc(100% - 28px)
        );

    min-height: 100vh;

    margin: auto;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 35px 0;

}


/* =========================================================
   ЛОГОТИП
========================================================= */

.logo-wrap {

    opacity: 0;

    transform:
        translateY(-15px);

    animation:
        logoAppear 1s ease forwards;

    animation-delay: .15s;

}


.logo {

    width:
        min(
            270px,
            70vw
        );

    height: auto;

    display: block;

    filter:
        drop-shadow(
            0 0 18px
            rgba(67,218,193,0.12)
        );

}


@keyframes logoAppear {

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   РАЗДЕЛИТЕЛЬ
========================================================= */

.line {

    width: 45px;

    height: 2px;

    margin:
        25px 0 20px;

    background:
        var(--tiffany);

    box-shadow:
        0 0 14px
        rgba(67,218,193,.5);

    animation:
        lineAppear 1s ease forwards;

    animation-delay: .4s;

    opacity: 0;

    transform:
        scaleX(0);

}


@keyframes lineAppear {

    to {

        opacity: 1;

        transform:
            scaleX(1);

    }

}


/* =========================================================
   ЗАГОЛОВОК
========================================================= */

.title {

    font-size:
        clamp(
            25px,
            7vw,
            38px
        );

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -.045em;

    opacity: 0;

    transform:
        translateY(15px);

    animation:
        textAppear .8s ease forwards;

    animation-delay: .5s;

}


.title span {

    color:
        var(--tiffany);

}


/* =========================================================
   ПОДЗАГОЛОВОК
========================================================= */

.subtitle {

    margin-top: 13px;

    color:
        var(--muted);

    font-size: 14px;

    line-height: 1.5;

    max-width: 380px;

    opacity: 0;

    transform:
        translateY(15px);

    animation:
        textAppear .8s ease forwards;

    animation-delay: .65s;

}


@keyframes textAppear {

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   КНОПКИ — ОСНОВНОЙ БЛОК
========================================================= */

.buttons {

    width: 100%;

    margin-top: 30px;

    display: flex;

    flex-direction: column;

    gap: 10px;

    opacity: 0;

    transform:
        translateY(20px);

    animation:
        buttonsAppear .8s ease forwards;

    animation-delay: .8s;

}


@keyframes buttonsAppear {

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   КНОПКА
========================================================= */

.button {

    position: relative;

    width: 100%;

    min-height: 58px;

    padding:
        0 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 15px;

    border:
        1px solid var(--border);

    background:
        var(--button-dark);

    backdrop-filter:
        blur(12px);

    color: white;

    font-size: 14px;

    font-weight: 700;

    text-decoration: none;

    overflow: hidden;

    /*
       ВАЖНО:

       opacity добавлен для плавного исчезновения.

       transform увеличен до .55s,
       чтобы движение вниз было мягким.
    */

    transition:

        transform .55s ease,

        opacity .55s ease,

        border-color .25s ease,

        background .25s ease,

        box-shadow .25s ease;

}


/* =========================================================
   TIFFANY — ОСНОВНЫЕ КНОПКИ
========================================================= */

.button.primary {

    background:
        var(--tiffany);

    color:
        #03100d;

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 30px
        rgba(67,218,193,.12);

}


.button.primary:hover {

    background:
        #00eaff;

    box-shadow:
        0 10px 35px
        rgba(67,218,193,.22);

}


/* =========================================================
   ОБЫЧНАЯ КНОПКА — HOVER
========================================================= */

.button:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 25px
        rgba(67,218,193,.10);

}


/* =========================================================
   КАСКАДНОЕ ИСЧЕЗНОВЕНИЕ
========================================================= */

/*
   Нажатая кнопка получает класс .clicked
   и НЕ исчезает.

   Все остальные кнопки:
   - опускаются вниз;
   - становятся прозрачными;
   - перестают принимать нажатия.
*/

.buttons.cascade
.button:not(.clicked) {

    opacity: 0;

    transform:
        translateY(80px);

    pointer-events: none;

}


/* =========================================================
   ЗАДЕРЖКА КАЖДОЙ КНОПКИ
========================================================= */

/*
   Чем ниже кнопка находится,
   тем позже она начинает исчезать.
*/

.buttons.cascade
.button:not(.clicked):nth-child(1) {

    transition-delay:
        0s;

}


.buttons.cascade
.button:not(.clicked):nth-child(2) {

    transition-delay:
        .08s;

}


.buttons.cascade
.button:not(.clicked):nth-child(3) {

    transition-delay:
        .16s;

}


.buttons.cascade
.button:not(.clicked):nth-child(4) {

    transition-delay:
        .24s;

}


.buttons.cascade
.button:not(.clicked):nth-child(5) {

    transition-delay:
        .32s;

}


.buttons.cascade
.button:not(.clicked):nth-child(6) {

    transition-delay:
        .40s;

}


/* =========================================================
   НАЖАТАЯ КНОПКА
========================================================= */

/*
   Сохраняем её на месте.

   Это также отключает hover-подъём,
   чтобы она визуально действительно
   оставалась там, где её нажали.
*/

.buttons.cascade
.button.clicked {

    transform:
        translateY(0);

}


/* =========================================================
   МАЛЕНЬКАЯ ПОДПИСЬ
========================================================= */

.small {

    margin-top: 22px;

    color:
        #606b68;

    font-size: 10px;

    letter-spacing: .16em;

    text-transform: uppercase;

    opacity: 0;

    animation:
        fadeIn 1s ease forwards;

    animation-delay: 1.1s;

}


@keyframes fadeIn {

    to {

        opacity: 1;

    }

}


/* =========================================================
   СТАТУС
========================================================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-top: 25px;

    color:
        #37ff00;

    font-size: 10px;

    letter-spacing: .12em;

    text-transform: uppercase;

}


.status-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background:
        #37ff00;

    box-shadow:
        0 0 12px
        #37ff00;

    animation:
        pulse 2s infinite;

}


@keyframes pulse {

    0%,100% {

        opacity: .5;

        transform:
            scale(.8);

    }

    50% {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================================================
   НИЖНЯЯ НАДПИСЬ
========================================================= */

.footer {

    margin-top: auto;

    padding-top: 35px;

    color:
        #464f4d;

    font-size: 9px;

    letter-spacing: .16em;

    text-transform: uppercase;

}


/* =========================================================
   МОБИЛЬНЫЕ
========================================================= */

@media (max-width: 500px) {

    .card {

        width:
            calc(100% - 30px);

        padding:
            28px 0;

    }


    .logo {

        width:
            230px;

    }


    .title {

        font-size:
            27px;

    }


    .subtitle {

        font-size:
            13px;

    }


    .button {

        min-height:
            56px;

        border-radius:
            14px;

    }

}


/* =========================================================
   УМЕНЬШЕНИЕ АНИМАЦИЙ
   ДЛЯ ПОЛЬЗОВАТЕЛЕЙ, КОТОРЫМ ОНИ НЕ НУЖНЫ
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;

        scroll-behavior:
            auto !important;

    }

}

</style>

</head>


<body>


<div class="glow"></div>


<main class="card">


    <!-- =====================================================
         ЛОГОТИП
    ====================================================== -->

    <div class="logo-wrap">

        <img
            src="metiz-project-logo.png"
            alt="METIZ PROJECT"
            class="logo"
        >

    </div>


    <!-- =====================================================
         РАЗДЕЛИТЕЛЬ
    ====================================================== -->

    <div class="line"></div>


    <!-- =====================================================
         ЗАГОЛОВОК
    ====================================================== -->

    <h1 class="title">

        Печатаем и режем

        <br>

        <span>
            под ваши задачи
        </span>

    </h1>


    <!-- =====================================================
         ПОДЗАГОЛОВОК
    ====================================================== -->

    <p class="subtitle">

        Наклейки • Печать • Плоттерная резка

    </p>


    <!-- =====================================================
         ОСНОВНЫЕ КНОПКИ
    ====================================================== -->

    <div class="buttons">


        <!-- =================================================
             VK — ГРУППА
        ================================================== -->

        <a
            href="https://vk.ru/metiz_project"
            target="_blank"
            rel="noopener noreferrer"
            class="button primary"
        >

            Группа ВКонтакте

        </a>


        <!-- =================================================
             VK — СООБЩЕНИЯ
        ================================================== -->

        <a
            href="https://vk.ru/im?sel=-10150150"
            target="_blank"
            rel="noopener noreferrer"
            class="button primary"
        >

            Написать ВКонтакте

        </a>


        <!-- =================================================
             TELEGRAM
        ================================================== -->

        <a
            href="https://t.me/metizproject"
            target="_blank"

            class="button primary"
        >

            Написать в Telegram

        </a>


        <!-- =================================================

        ================================================== -->

        <a
            href="https://wa.me/message/RDHE3F4PU2D3L1"
            target="_blank"
            rel="noopener noreferrer"
            class="button primary"
        >

            Написать в WhatsApp

        </a>


        <!-- =================================================
             ТЕСТОВАЯ СТРАНИЦА
        ================================================== -->

        <a
            href="test.html"
            class="button primary"
        >

            ТЕСТОВАЯ КНОПКА

        </a>


        <!-- =================================================

        ================================================== -->

        <a
            href="#"
            class="button"
            onclick="openWorks(event)"
        >

        </a>


    </div>


    <!-- =====================================================
         СТАТУС
    ====================================================== -->

    <div class="status">

        <span class="status-dot"></span>

        Online

    </div>


    <!-- =====================================================
         МАЛЕНЬКАЯ ПОДПИСЬ
    ====================================================== -->

    <div class="small">

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        © METIZ PROJECT 2010-2026

    </div>


</main>


<script>

/* =========================================================
   КАСКАД КНОПОК
========================================================= */

/*
   Когда пользователь нажимает любую кнопку:

   1. Нажатая кнопка получает класс .clicked.
   2. Она остаётся на своём месте.
   3. Остальные кнопки получают класс .cascade.
   4. Остальные кнопки плавно опускаются вниз
      и исчезают одна за другой.
*/

const buttonsContainer =
    document.querySelector('.buttons');

const buttons =
    document.querySelectorAll('.buttons .button');


let cascadeStarted = false;


buttons.forEach(button => {

    button.addEventListener('click', function(event) {

        /*
           Если каскад уже запущен,
           повторное нажатие блокируем.
        */

        if (cascadeStarted) {

            event.preventDefault();

            return;

        }


        /*
           Запоминаем нажатую кнопку.
        */

        this.classList.add('clicked');


        /*
           Запускаем каскад.
        */

        buttonsContainer.classList.add('cascade');

        cascadeStarted = true;


        /*
        =====================================================
        ТЕСТОВАЯ КНОПКА
        =====================================================

        Делаем небольшую задержку,
        чтобы пользователь успел увидеть анимацию.

        После этого открываем test.html.
        */

        const href =
            this.getAttribute('href');


        if (href === 'test.html') {

            event.preventDefault();


            setTimeout(function() {

                window.location.href =
                    href;

            }, 700);

        }

    });

});


/* =========================================================
   КНОПКА "НАШИ РАБОТЫ"
========================================================= */

function openWorks(event) {

    event.preventDefault();


    alert(
        "Раздел «Наши работы» скоро будет доступен."
    );

}

</script>
