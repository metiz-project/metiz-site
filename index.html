<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>METIZ PROJECT</title>

<meta name="description" content="METIZ PROJECT — наклейки, печать, плоттерная резка и брендирование автомобилей.">

<style>

/* =========================================================
   METIZ PROJECT
   НАСТРОЙКИ — здесь в дальнейшем можно менять сайт
========================================================= */

:root {
    --tiffany: #38cad8; /* ====================================================================================== ЦВЕТ КНОПОК == */

    --background: #050707; /* ===================================================================== НАЧАЛО ЦВЕТА ГРАДИЕНТА ОТ ВЕРХНЕГО ЛЕВОГО УГЛА == */
    --background-2: #0b0f0e; /* =================================================================== КОНЕЦ ЦВЕТА ГРАДИЕНТА В НИЖНЕМ ПРАВОМ УГЛУ == */

    --text: #ffffff; /* ===================================================== цвет надписей "ПЕЧАТАЕМ И РЕЖЕМ" и "НАКЛЕЙКИ.ПЕЧАТЬ.ПЛОТТЕРНАЯ РЕЗКА.БРЕНДИРОВАНИЕ АВТОМОБИЛЕЙ" == */
    --muted: #9ca7a4; /* == ==================================================================!!!! НЕ ПОНЯТНО ЗА ЧТО ОТВЕЧАЕТ ЭТОТ ЦВЕТ !!!! == */

    --button-dark: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
}


/* =========================================================
   ОСНОВА
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(67,218,193,0.12),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            var(--background),
            var(--background-2)
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   ФОНОВАЯ СЕТКА
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.22;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    z-index: -3;
}


/* =========================================================
   TIFFANY СВЕЧЕНИЕ
========================================================= */

.glow {

    position: fixed;

    width: 420px;
    height: 420px;

    left: 50%;
    top: 35%;

    transform: translate(-50%, -50%);

    background: var(--tiffany);

    filter: blur(180px);

    opacity: 0.07;

    pointer-events: none;

    animation: glowMove 8s ease-in-out infinite alternate;

    z-index: -2;
}

@keyframes glowMove {

    from {
        transform:
            translate(-50%, -50%)
            scale(0.9);
    }

    to {
        transform:
            translate(-48%, -53%)
            scale(1.15);
    }
}


/* =========================================================
   ВИЗИТКА
========================================================= */

.card {

    width: min(520px, calc(100% - 28px));

    min-height: 100vh;

    margin: auto;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 35px 0;
}


/* =========================================================
   ЛОГОТИП
========================================================= */

.logo-wrap {

    opacity: 0;

    transform: translateY(-15px);

    animation:
        logoAppear 1s ease forwards;

    animation-delay: .15s;
}

.logo {

    width: min(270px, 70vw);

    height: auto;

    display: block;

    filter:
        drop-shadow(
            0 0 18px
            rgba(67,218,193,0.12)
        );
}

@keyframes logoAppear {

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   РАЗДЕЛИТЕЛЬ
========================================================= */

.line {

    width: 45px;

    height: 2px;

    margin: 25px 0 20px;

    background: #38cad8; /* ================================================================================ ЦВЕТ ПОЛОСКИ ПОД ЛОГОТИПОМ ВВЕРХУ == */

    box-shadow:
        0 0 14px
        rgba(67,218,193,.5);

    animation:
        lineAppear 1s ease forwards;

    animation-delay: .4s;

    opacity: 0;

    transform: scaleX(0);
}

@keyframes lineAppear {

    to {

        opacity: 1;

        transform:
            scaleX(1);
    }
}


/* =========================================================
   ЗАГОЛОВОК
========================================================= */

.title {

    font-size:
        clamp(25px, 7vw, 38px);

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -.045em;

    opacity: 0;

    transform: translateY(15px);

    animation:
        textAppear .8s ease forwards;

    animation-delay: .5s;
}

.title span {

    color: #38cad8; /* ======================================================================== ЦВЕТ НАДПИСИ "ПОД ВАШИ ЗАДАЧИ" == */
}


/* =========================================================
   ПОДЗАГОЛОВОК
========================================================= */

.subtitle {

    margin-top: 13px;

    color: var(--muted));

    font-size: 14px;

    line-height: 1.5;

    max-width: 380px;

    opacity: 0;

    transform: translateY(15px);

    animation:
        textAppear .8s ease forwards;

    animation-delay: .65s;
}

@keyframes textAppear {

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   КНОПКИ
========================================================= */

.buttons {

    width: 100%;

    margin-top: 30px;

    display: flex;

    flex-direction: column;

    gap: 10px;

    opacity: 0;

    transform: translateY(20px);

    animation:
        buttonsAppear .8s ease forwards;

    animation-delay: .8s;
}

@keyframes buttonsAppear {

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.button {

    position: relative;

    width: 100%;

    min-height: 58px;

    padding: 0 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 15px;

    border: 1px solid var(--border);

    background:
        var(--button-dark);

    backdrop-filter: blur(12px);

    color: white;

    font-size: 14px;

    font-weight: 700;

    text-decoration: none;

    overflow: hidden;

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}


/* Tiffany первая кнопка */

.button.primary {

    background:
        var(--tiffany);

    color: #03100d; /* =========================================================================== ЦВЕТ ТЕКСТА НА ПЕРВЫХ ТРЕХ КНОПОК == */

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 30px
        rgba(67,218,193,.12);
}


.button:hover {

    transform:
        translateY(-2px);

    border-color:
        var (--tiffany);

    box-shadow:
        0 8px 25px
        rgba(67,218,193,.10);
}


.button.primary:hover {

    background:
        #13d5e7; /* ========================================================================= ПОДСВЕТКА КНОПОК, КОГДА НАВОДИШЬ НА КНОПКИ == */

    box-shadow:
        0 10px 35px
        rgba(67,218,193,.22);
}


/* =========================================================
   МАЛЕНЬКАЯ ПОДПИСЬ
========================================================= */

.small {

    margin-top: 22px;

    color: #606b68; /* ================================================================ ПРЕДПОСЛЕДНЯЯ НАДПИСЬ ВНИЗУ Stickers / Print / Branding == */

    font-size: 10px;

    letter-spacing: .16em;

    text-transform: uppercase;

    opacity: 0;

    animation:
        fadeIn 1s ease forwards;

    animation-delay: 1.1s;
}

@keyframes fadeIn {

    to {
        opacity: 1;
    }
}


/* =========================================================
   АНИМАЦИЯ TIFFANY ТОЧКИ
========================================================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-top: 25px;

    color: #6f7b78; /* ============================================================== Надпись METIZ PROJECT, РЯДОМ С ПУЛЬСИРУЮЩЕЙ ТОЧКОЙ == */

    font-size: 10px;

    letter-spacing: .12em;

    text-transform: uppercase;
}

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        var(--tiffany);

    box-shadow:
        0 0 12px
        var(--tiffany);

    animation:
        pulse 2s infinite;
}

@keyframes pulse {

    0%,100% {
        opacity: .5;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================================================
   НИЖНЯЯ НАДПИСЬ
========================================================= */

.footer {

    margin-top: auto;

    padding-top: 35px;

    color: #464f4d; /* ========================================================================= НАДПИСЬ ВНИЗУ © METIZ PROJECT 2026 == */

    font-size: 9px;

    letter-spacing: .16em;

    text-transform: uppercase;
}


/* =========================================================
   МОБИЛЬНЫЕ
========================================================= */

@media (max-width: 500px) {

    .card {

        width:
            calc(100% - 30px);

        padding:
            28px 0;
    }

    .logo {

        width: 230px;
    }

    .title {

        font-size: 27px;
    }

    .subtitle {

        font-size: 13px;
    }

    .button {

        min-height: 56px;

        border-radius: 14px;
    }
}

</style>
</head>


<body>

<div class="glow"></div>


<main class="card">


    <!-- =====================================================
         ЛОГОТИП
    ====================================================== -->

    <div class="logo-wrap">

        <img
            src="metiz-project-logo.png"
            alt="METIZ PROJECT"
            class="logo"
        >

    </div>


    <div class="line"></div>


    <!-- =====================================================
         ЗАГОЛОВОК
    ====================================================== -->

    <h1 class="title">

        Печатаем и режем
        <br>

        <span>под ваши задачи</span>

    </h1>


    <p class="subtitle">

        Наклейки • Печать • Плоттерная резка
        • Брендирование автомобилей

    </p>


    <!-- =====================================================
         ОСНОВНЫЕ КНОПКИ
    ====================================================== -->

    <div class="buttons">


        <!-- WHATSAPP -->

        <a
            href="https://wa.me/79650050990"
            target="_blank"
            class="button primary"
        >

            Написать в WhatsApp

        </a>


        <!-- TELEGRAM -->

        <a
            href="https://t.me/metiz_project"
            target="_blank"
            class="button primary"
        >

            Написать в Telegram

        </a>


        <!-- VK -->

        <a
            href="https://vk.ru/metiz_project"
            target="_blank"
            class="button primary"
        >

            ВКонтакте

        </a>


        <!-- РАБОТЫ -->

        <a
            href="#"
            class="button"
            onclick="openWorks(event)"
        >

            Посмотреть наши работы →

        </a>


    </div>


    <!-- =====================================================
         СТАТУС
    ====================================================== -->

    <div class="status">

        <span class="status-dot"></span>

        METIZ PROJECT

    </div>


    <div class="small">

        Stickers / Print / Branding

    </div>


    <div class="footer">

        © METIZ PROJECT 2026

    </div>


</main>


<script>

/*
=========================================================
КНОПКА "НАШИ РАБОТЫ"

Пока оставляем её как подготовленную кнопку.

Позже вместо "#" можно поставить:
works.html

и сделать отдельную красивую галерею.
=========================================================
*/

function openWorks(event) {

    event.preventDefault();

    alert(
        "Раздел «Наши работы» скоро будет доступен."
    );

}

</script>

</body>
</html>
