<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<title>METIZ PROJECT</title>

<style>
    :root {
        --black: #000000;
        --tiffany: #43D8D3;
        --tiffany-bright: #59FFF4;
        --white: #FFFFFF;
        --btn-text: #001A18; /* Красивый глубокий темный цвет для текста внутри кнопок */
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        background: #000000 !important;
        color-scheme: dark !important;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #000000 !important;
        color: #FFFFFF;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        display: flex;
        justify-content: center;
        overflow-x: hidden;
    }

    .page {
        width: 100%;
        max-width: 680px;
        min-height: 100vh;
        padding: 48px 28px 34px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    /* LOGO */

    .logo {
        width: 245px;
        max-width: 78vw;
        height: auto;
        display: block;
        margin: 8px auto 30px;
    }

    /* DIVIDER */

    .line {
        width: 96px;
        height: 5px;
        background: #43D8D3;
        border-radius: 10px;
        margin-bottom: 34px;

        filter: brightness(1.25);
        -webkit-filter: brightness(1.25);
    }

    /* TITLE */

    h1 {
        margin: 0;
        padding: 0;

        font-size: clamp(38px, 8vw, 64px);
        line-height: 0.98;
        letter-spacing: -2.5px;
        font-weight: 900;
    }

    h1 .white {
        display: block;
        color: #FFFFFF !important;
        -webkit-text-fill-color: #FFFFFF !important;
    }

    h1 .tiffany {
        display: block;

        color: #43D8D3 !important;
        -webkit-text-fill-color: #43D8D3 !important;

        filter: brightness(1.35);
        -webkit-filter: brightness(1.35);
    }

    /* DESCRIPTION */

    .description {
        margin: 38px 0 46px;

        max-width: 620px;

        font-size: clamp(18px, 4.5vw, 25px);
        line-height: 1.45;
        font-weight: 800;

        color: #59FFF4 !important;
        -webkit-text-fill-color: #59FFF4 !important;

        filter: brightness(1.15);
        -webkit-filter: brightness(1.15);
    }

    /* BUTTONS */

    .buttons {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .btn {
        position: relative;
        width: 100%;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px; /* Отступ между иконкой и текстом */
        padding: 18px 22px;
        border-radius: 25px;
        text-decoration: none;
        font-size: clamp(21px, 5vw, 28px);
        line-height: 1.15;
        font-weight: 900;
        
        /* ЦВЕТ КНОПОК ПО УМОЛЧАНИЮ (Точно как «под ваши задачи») */
        background: #43D8D3 !important;
        color: var(--btn-text) !important;
        -webkit-text-fill-color: var(--btn-text) !important;
        border: 3px solid #59FFF4 !important;

        filter: brightness(1.2);
        -webkit-filter: brightness(1.2);

        box-shadow:
            0 0 4px rgba(67, 216, 211, 0.3),
            0 8px 24px rgba(67, 216, 211, 0.15);

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            filter 0.15s ease;
    }

    /* Стилизация иконок внутри кнопок */
    .btn svg {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        fill: var(--btn-text); /* Иконка красится в цвет текста */
    }

    .btn:hover, .btn:active {
        filter: brightness(1.35);
        -webkit-filter: brightness(1.35);
        box-shadow:
            0 0 10px rgba(89, 255, 244, 0.6),
            0 8px 28px rgba(67, 216, 211, 0.3);
    }

    .btn:active {
        transform: scale(0.985);
    }

    /* КНОПКА "НАШИ РАБОТЫ" (Контурная) */
    .btn-outline {
        margin-top: 2px;
        background: #000000 !important;
        color: #59FFF4 !important;
        -webkit-text-fill-color: #59FFF4 !important;
        border: 3px solid #43D8D3 !important;
        filter: brightness(1.25);
        -webkit-filter: brightness(1.25);
        box-shadow:
            0 0 0 1px rgba(67,216,211,0.25),
            0 8px 24px rgba(67,216,211,0.10);
    }

    /* FOOTER */

    .footer {
        margin-top: 42px;
        padding-bottom: 10px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 23px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 13px;

        font-size: 16px;
        letter-spacing: 4px;
        font-weight: 500;

        color: #59FFF4 !important;
        -webkit-text-fill-color: #59FFF4 !important;

        filter: brightness(1.15);
        -webkit-filter: brightness(1.15);
    }

    .brand-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;

        background: #43D8D3 !important;

        filter: brightness(1.35);
        -webkit-filter: brightness(1.35);
    }

    .categories {
        font-size: 14px;
        letter-spacing: 5px;
        font-weight: 500;

        color: #43D8D3 !important;
        -webkit-text-fill-color: #43D8D3 !important;

        filter: brightness(1.3);
        -webkit-filter: brightness(1.3);
    }

    /* MOBILE */

    @media (max-width: 480px) {

        .page {
            padding:
                38px
                28px
                28px;
        }

        .logo {
            width: 245px;
            margin-bottom: 28px;
        }

        .line {
            width: 96px;
            height: 5px;
            margin-bottom: 34px;
        }

        h1 {
            font-size: 43px;
            letter-spacing: -2px;
        }

        .description {
            margin-top: 38px;
            margin-bottom: 46px;

            font-size: 20px;
            line-height: 1.45;
        }

        .buttons {
            gap: 17px;
        }

        .btn {
            min-height: 102px;
            border-radius: 25px;
            font-size: 25px;
            gap: 12px;
        }
        
        .btn svg {
            width: 28px;
            height: 28px;
        }

        .footer {
            margin-top: 42px;
        }

        .brand {
            font-size: 15px;
            letter-spacing: 4px;
        }

        .categories {
            font-size: 13px;
            letter-spacing: 4px;
        }
    }

    /* VERY SMALL PHONES */

    @media (max-height: 720px) {

        .page {
            padding-top: 25px;
        }

        .logo {
            width: 210px;
            margin-bottom: 22px;
        }

        .line {
            margin-bottom: 24px;
        }

        .description {
            margin-top: 28px;
            margin-bottom: 32px;
        }

        .btn {
            min-height: 82px;
        }

        .footer {
            margin-top: 28px;
        }
    }
</style>
</head>

<body>

<main class="page">

    <!-- ЛОГОТИП -->
    <img
        class="logo"
        src="metiz-project-logo.png"
        alt="METIZ PROJECT"
    >

    <!-- ЛИНИЯ -->
    <div class="line"></div>

    <!-- ЗАГОЛОВОК -->
    <h1>
        <span class="white">Печатаем и режем</span>
        <span class="tiffany">под ваши задачи</span>
    </h1>

    <!-- ОПИСАНИЕ -->
    <div class="description">
        Наклейки • Печать • Плоттерная резка • Брендирование автомобилей
    </div>

    <!-- КНОПКИ -->
    <div class="buttons">

        <!-- WHATSAPP -->
        <a
            class="btn"
            href="https://wa.me"
            target="_blank"
            rel="noopener noreferrer"
        >
