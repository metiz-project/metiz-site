<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>METIZ PROJECT</title>

<style>
:root {
    --turquoise: #75D5D1;
    --turquoise-bright: #8DE8E3;
    --turquoise-dark: #55C5C0;
    --black: #050908;
    --text: #F2FFFF;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(117, 213, 209, 0.13),
            transparent 32%
        ),
        linear-gradient(
            180deg,
            #07100F 0%,
            #050908 55%,
            #020504 100%
        );

    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;

    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(117,213,209,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(117,213,209,0.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;
    pointer-events: none;
}

.container {
    width: min(100%, 620px);
    min-height: 100vh;

    padding: 34px 23px 25px;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;
    z-index: 2;
}

/* ЛОГОТИП */

.logo {
    width: 255px;
    max-width: 78vw;
    height: auto;

    filter:
        drop-shadow(0 0 7px rgba(117,213,209,0.65))
        drop-shadow(0 0 22px rgba(117,213,209,0.28));

    animation: logoAppear 1s ease forwards;
}

/* ДЕКОР */

.line {
    width: 44px;
    height: 3px;

    margin-top: 34px;
    margin-bottom: 22px;

    background: var(--turquoise);

    box-shadow:
        0 0 8px var(--turquoise),
        0 0 22px rgba(117,213,209,0.55);

    border-radius: 10px;
}

/* ЗАГОЛОВОК */

h1 {
    margin: 0;

    text-align: center;

    font-size: clamp(34px, 8vw, 55px);
    line-height: 0.98;
    letter-spacing: -2px;
    font-weight: 900;

    color: var(--turquoise-bright);

    text-shadow:
        0 0 8px rgba(117,213,209,0.55),
        0 0 25px rgba(117,213,209,0.25);
}

h1 span {
    display: block;
    color: #FFFFFF;
    margin-bottom: 5px;
}

/* ПОДЗАГОЛОВОК */

.subtitle {
    margin-top: 18px;

    max-width: 500px;

    text-align: center;

    color: var(--turquoise);

    font-size: 15px;
    line-height: 1.55;

    opacity: 0.9;

    text-shadow:
        0 0 10px rgba(117,213,209,0.22);
}

/* КНОПКИ */

.buttons {
    width: 100%;
    margin-top: 30px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.button {
    width: 100%;
    min-height: 59px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 16px 20px;

    border-radius: 15px;

    text-decoration: none;

    background: var(--turquoise);
    color: #06100F;

    font-size: 15px;
    font-weight: 800;

    border: 1px solid var(--turquoise-bright);

    box-shadow:
        0 0 8px rgba(117,213,209,0.45),
        0 0 24px rgba(117,213,209,0.18);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.button:hover {
    transform: translateY(-2px);

    background: var(--turquoise-bright);

    box-shadow:
        0 0 12px rgba(117,213,209,0.8),
        0 0 35px rgba(117,213,209,0.38);
}

.button:active {
    transform: scale(0.98);
}

/* РАБОТЫ */

.works {
    margin-top: 4px;

    background: rgba(117,213,209,0.09);
    color: var(--turquoise-bright);

    border: 1px solid rgba(117,213,209,0.55);

    box-shadow:
        0 0 10px rgba(117,213,209,0.18);
}

.works:hover {
    background: rgba(117,213,209,0.16);
}

/* НИЖНИЙ БЛОК */

.brand-info {
    margin-top: 26px;

    text-align: center;

    color: var(--turquoise);

    opacity: 0.65;

    font-size: 10px;
    letter-spacing: 2px;

    text-shadow:
        0 0 8px rgba(117,213,209,0.3);
}

.brand-info .dot {
    display: inline-block;

    width: 5px;
    height: 5px;

    margin-right: 8px;

    border-radius: 50%;

    background: var(--turquoise);

    box-shadow:
        0 0 7px var(--turquoise);
}

.services {
    margin-top: 19px;

    font-size: 10px;
    letter-spacing: 3px;

    color: var(--turquoise);
    opacity: 0.55;
}

/* КОПИРАЙТ */

.footer {
    margin-top: auto;
    padding-top: 55px;

    font-size: 9px;
    letter-spacing: 2px;

    color: var(--turquoise);

    opacity: 0.42;
}

/* АНИМАЦИЯ */

@keyframes logoAppear {
    from {
        opacity: 0;
        transform: translateY(-12px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 420px) {

    .container {
        padding-top: 28px;
        padding-left: 20px;
        padding-right: 20px;
    }

    .logo {
        width: 235px;
    }

    .line {
        margin-top: 28px;
    }

    h1 {
        font-size: 36px;
    }

    .subtitle {
        font-size: 14px;
    }

    .button {
        min-height: 58px;
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        src="metiz-project-logo.png"
        alt="METIZ PROJECT"
        class="logo"
    >

    <div class="line"></div>

    <h1>
        <span>Печатаем и режем</span>
        под ваши задачи
    </h1>

    <div class="subtitle">
        Наклейки • Печать • Плоттерная резка • Брендирование автомобилей
    </div>

    <div class="buttons">

        <a
            class="button"
            href="https://wa.me/79650050990"
            target="_blank"
        >
            Написать в WhatsApp
        </a>

        <a
            class="button"
            href="https://t.me/metiz_project"
            target="_blank"
        >
            Написать в Telegram
        </a>

        <a
            class="button"
            href="https://vk.ru/metiz_project"
            target="_blank"
        >
            ВКонтакте
        </a>

        <a
            class="button works"
            href="works.html"
        >
            Посмотреть наши работы →
        </a>

    </div>

    <div class="brand-info">
        <span class="dot"></span>
        METIZ PROJECT
    </div>

    <div class="services">
        STICKERS / PRINT / BRANDING
    </div>

    <div class="footer">
        © METIZ PROJECT 2026
    </div>

</div>

</body>
</html>
