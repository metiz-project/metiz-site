<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METIZ PROJECT — Информация</title>
    <meta name="description" content="METIZ PROJECT — информация и обратная связь.">
    
    <!-- Подключение библиотеки иконок для кнопок -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* =========================================================
           НАСТРОЙКИ И ПЕРЕМЕННЫЕ
        ========================================================= */
        :root {
            --tiffany: #4cd5d3;
            --background: #050707;
            --background-2: #0b0f0e;
            --text: #ffffff;
            --muted: #9ca7a4;
            --button-dark: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.04); /* Тонкая темная сетка */
        }

        /* =========================================================
           ОСНОВА СТРАНИЦЫ
        ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(67, 218, 193, 0.12),
                    transparent 32%
                ),
                linear-gradient(
                    145deg,
                    var(--background),
                    var(--background-2)
                );
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            opacity: 0;
            transform: translateY(8px);
            animation: pageAppear 0.55s ease forwards;
            padding: 40px 20px;
        }

        /* Анимация плавного появления страницы */
        @keyframes pageAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           ФОНОВАЯ СЕТКА
        ========================================================= */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* =========================================================
           ОСНОВНОЙ КОНТЕЙНЕР И ТИПОГРАФИКА
        ========================================================= */
        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        /* Контейнер для SVG логотипа */
        .logo-container {
            margin-bottom: 25px;
            display: inline-block;
        }

        .logo-svg {
            width: 210px;
            height: auto;
            filter: drop-shadow(0px 0px 12px rgba(76, 213, 211, 0.3));
        }

        /* Декоративная линия под логотипом */
        .divider {
            width: 45px;
            height: 2px;
            background-color: var(--tiffany);
            margin: 0 auto 35px auto;
            box-shadow: 0 0 10px var(--tiffany);
        }

        /* Заголовки */
        h1 {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--tiffany);
            display: block;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 40px;
            letter-spacing: 0.3px;
        }

        /* =========================================================
           КНОПКИ И ИНТЕРАКТИВ
        ========================================================= */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, background-color 0.2s;
        }

        /* Главные мятные кнопки */
        .btn-primary {
            background-color: var(--tiffany);
            color: #050707;
        }

        .btn-primary:hover {
            transform: scale(1.015);
            box-shadow: 0 6px 20px rgba(76, 213, 211, 0.35);
        }

        /* Темная контурная кнопка */
        .btn-dark {
            background-color: var(--button-dark);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: normal;
        }

        .btn-dark:hover {
            background-color: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.015);
        }

        .btn i {
            font-size: 16px;
        }

        /* =========================================================
           НИЖНЯЯ ЧАСТЬ (МЕТКИ И СТАТУС)
        ========================================================= */
        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #00ff66;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status-online::before {
            content: "";
            width: 6px;
            height: 6px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
        }

        .tags {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 50px;
        }

        .copyright {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Оригинальный векторный логотип из макета -->
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 240 70" xmlns="http://w3.org">
                <!-- Внешняя капсула с разрывом под текст -->
                <rect x="5" y="5" width="230" height="60" rx="30" fill="none" stroke="#4cd5d3" stroke-width="4"/>
                <!-- Заливка фона под текстом (чтобы скрыть линию рамки, если она пересекается) -->
                <rect x="22" y="2" width="112" height="66" fill="#060808" rx="10" />
                <rect x="138" y="32" width="78" height="6" fill="#060808" />
                <!-- Текст Metiz -->
                <text x="32" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="0.5">Metiz</text>
                <!-- Текст PROJECT с нижним подчеркиванием -->
                <text x="142" y="44" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#4cd5d3" letter-spacing="1">PROJECT</text>
                <line x1="142" y1="50" x2="216" y2="50" stroke="#4cd5d3" stroke-width="2" />

        <div class="divider"></div>
        
        <!-- Основные заголовки -->
        <h1>Печатаем и режем <span>под ваши задачи</span></h1>
        <p class="subtitle">Наклейки • Печать • Плоттерная резка</p>

        <!-- Список интерактивных кнопок -->

            </a>
            <a href="#" class="btn btn-dark">

        </div>
