<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>METIZ PROJECT</title>

<style>
:root {
    --bg: #000000;
    --tiffany: #8FFFF7;
    --tiffany-bright: #BFFFFB;
    --tiffany-dark: #062522;
    --white: #FFFFFF;
    --text: #EFFFFD;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #000000 !important;
    color-scheme: dark !important;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 8%,
            rgba(80, 255, 238, 0.07),
            transparent 27%
        ),
        #000000 !important;

    color: #FFFFFF;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

.container {
    width: min(100%, 620px);
    min-height: 100vh;

    margin: 0 auto;
    padding: 26px 18px 22px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   LOGO
========================= */

.logo {
    width: 245px;
    max-width: 78vw;
    height: auto;

    display: block;

    /*
       Логотип должен быть ярким,
       но без огромного ореола.
    */

    filter:
        brightness(1.08)
        saturate(1.12)
        drop-shadow(0 0 3px rgba(143,255,247,.35))
        !important;
}

/* =========================
   DIVIDER
========================= */

.line {
    width: 58px;
    height: 3px;

    margin: 25px 0 25px;

    background: #8FFFF7 !important;

    border-radius: 20px;

    box-shadow:
        0 0 5px rgba(143,255,247,.55) !important;
}

/* =========================
   TITLE
========================= */

h1 {
    margin: 0;

    width: 100%;

    text-align: center;

    font-size: clamp(34px, 8vw, 54px);
    line-height: .98;

    font-weight: 900;

    letter-spacing: -2.5px;

    color: #8FFFF7 !important;

    text-shadow:
        0 0 5px rgba(143,255,247,.22) !important;
}

h1 span {
    display: block;

    margin-bottom: 7px;

    color: #FFFFFF !important;

    text-shadow: none !important;
}

/* =========================
   DESCRIPTION
========================= */

.subtitle {
    width: 100%;
    max-width: 560px;

    margin-top: 21px;

    text-align: center;

    font-size: 14px;
    line-height: 1.55;

    font-weight: 500;

    color: #AFFFF9 !important;

    text-shadow: none !important;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    width: 100%;

    margin-top: 28px;

    display: flex;
    flex-direction: column;

    gap: 12px;
}

.button {
    width: 100%;
    min-height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 18px;

    border-radius: 16px;

    text-decoration: none;

    /*
       Главное изменение:
       кнопки реально светлые,
       а не тёмно-зелёные.
    */

    background: #AFFFF9 !important;
    background-color: #AFFFF9 !important;

    color: #001411 !important;

    border: 2px solid #CFFFFB !important;

    font-size: 16px;
    font-weight: 900;

    box-shadow:
        0 0 5px rgba(143,255,247,.55) !important;

    text-shadow: none !important;

    -webkit-appearance: none;
    appearance: none;

    forced-color-adjust: none;

    transition:
        transform .15s ease,
        background-color .15s ease;
}

.button:hover {
    background: #D7FFFC !important;
    background-color: #D7FFFC !important;

    box-shadow:
        0 0 8px rgba(143,255,247,.65) !important;
}

.button:active {
    transform: scale(.985);
}

/* =========================
   WORKS BUTTON
========================= */

.works {
    margin-top: 1px;

    background: #000000 !important;
    background-color: #000000 !important;

    color: #AFFFF9 !important;

    border: 2px solid #8FFFF7 !important;

    box-shadow:
        0 0 5px rgba(143,255,247,.45) !important;
}

.works:hover {
    background: #061512 !important;
    background-color: #061512 !important;
}

/* =========================
   BRAND INFO
========================= */

.brand-info {
    margin-top: 29px;

    color: #AFFFF9 !important;

    font-size: 10px;

    letter-spacing: 2.5px;

    text-shadow: none !important;
}

.dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 7px;

    border-radius: 50%;

    background: #8FFFF7 !important;

    box-shadow:
        0 0 5px rgba(143,255,247,.5) !important;
}

.services {
    margin-top: 17px;

    color: #8FFFF7 !important;

    font-size: 10px;

    letter-spacing: 3px;

    opacity: .78;

    text-shadow: none !important;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: auto;

    padding-top: 40px;

    color: #8FFFF7 !important;

    font-size: 9px;

    letter-spacing: 2px;

    opacity: .4;

    text-shadow: none !important;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 420px) {

    .container {
        padding:
            24px
            17px
            20px;
    }

    .logo {
        width: 235px;
    }

    .line {
        margin-top: 23px;
        margin-bottom: 23px;
    }

    h1 {
        font-size: 35px;
        letter-spacing: -2px;
    }

    .subtitle {
        margin-top: 19px;

        font-size: 14px;

        line-height: 1.5;
    }

    .buttons {
        margin-top: 26px;

        gap: 11px;
    }

    .button {
        min-height: 61px;

        border-radius: 15px;

        font-size: 16px;
    }

    .brand-info {
        margin-top: 26px;
    }

    .services {
        margin-top: 16px;
    }

    .footer {
        padding-top: 34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <img
        src="metiz-project-logo.png"
        alt="METIZ PROJECT"
        class="logo"
    >

    <!-- DIVIDER -->

    <div class="line"></div>

    <!-- TITLE -->

    <h1>
        <span>Печатаем и режем</span>
        под ваши задачи
    </h1>

    <!-- DESCRIPTION -->

    <div class="subtitle">
        Наклейки • Печать • Плоттерная резка •
        Брендирование автомобилей
    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <a
            class="button"
            href="https://wa.me/79650050990"
            target="_blank"
            rel="noopener"
        >
            Написать в WhatsApp
        </a>

        <a
            class="button"
            href="https://t.me/metiz_project"
            target="_blank"
            rel="noopener"
        >
            Написать в Telegram
        </a>

        <a
            class="button"
            href="https://vk.ru/metiz_project"
            target="_blank"
            rel="noopener"
        >
            ВКонтакте
        </a>

        <a
            class="button works"
            href="works.html"
        >
            Посмотреть наши работы →
        </a>

    </div>

    <!-- BRAND -->

    <div class="brand-info">
        <span class="dot"></span>
        METIZ PROJECT
    </div>

    <div class="services">
        STICKERS / PRINT / BRANDING
    </div>

    <!-- FOOTER -->

    <div class="footer">
        © METIZ PROJECT 2026
    </div>

</div>

</body>
</html>
