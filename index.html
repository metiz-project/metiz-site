<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METIZ PROJECT</title>

<style>
:root {
    --tiffany: #43DAC1;
    --tiffany-glow: rgba(67, 218, 193, 0.25);
    --tiffany-bright: #69eed7;
    --bg-dark: #0A0F0E;
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(67, 218, 193, 0.15);
    --text-white: #FFFFFF;
    --text-gray: #8E9A98;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background-color: var(--bg-dark);
}

body {
    min-height: 100vh;
    /* Дорогой глубокий градиент с эффектом студийного света сверху */
    background: 
        radial-gradient(circle at 50% -10%, rgba(67, 218, 193, 0.12), transparent 45%),
        linear-gradient(180deg, #0A0F0E 0%, #050707 100%);
    color: var(--text-white);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.container {
    width: min(100%, 540px);
    min-height: 100vh;
    padding: 40px 24px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
}

/* ЛОГОТИП */
.logo {
    width: 240px;
    max-width: 75vw;
    height: auto;
    /* Премиальное мягкое свечение логотипа */
    filter: drop-shadow(0 0 15px rgba(67, 218, 193, 0.3));
    animation: logoAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* ДЕКОРАТИВНАЯ ЛИНИЯ */
.line {
    width: 35px;
    height: 2px;
    margin-top: 30px;
    margin-bottom: 25px;
    background: var(--tiffany);
    box-shadow: 0 0 10px var(--tiffany);
    border-radius: 2px;
}

/* ЗАГОЛОВОК */
h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(32px, 7vw, 44px);
    line-height: 1.1;
    letter-spacing: -1px;
    font-weight: 800;
}

h1 span {
    display: block;
    color: var(--text-white);
    font-weight: 400;
    font-size: 0.85em;
    letter-spacing: 0px;
    margin-bottom: 4px;
    opacity: 0.9;
}

h1 .accent-text {
    color: var(--tiffany);
    text-shadow: 0 0 15px var(--tiffany-glow);
}

/* ПОДЗАГОЛОВОК */
.subtitle {
    margin-top: 15px;
    max-width: 420px;
    text-align: center;
    color: var(--text-gray);
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: 0.5px;
}

/* КНОПКИ */
.buttons {
    width: 100%;
    margin-top: 35px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.button {
    width: 100%;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Стиль мессенджеров: Дорогое темное стекло */
.btn-messenger {
    background: var(--card-bg);
    color: var(--text-white);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.btn-messenger:hover {
    background: rgba(67, 218, 193, 0.08);
    border-color: var(--tiffany);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(67, 218, 193, 0.12);
}

/* Акцентная главная кнопка: Светящийся Tiffany */
.btn-works {
    background: var(--tiffany);
    color: #050707;
    border: 1px solid var(--tiffany-bright);
    font-weight: 700;
    box-shadow: 0 4px 15px var(--tiffany-glow);
}

.btn-works:hover {
    background: var(--tiffany-bright);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(67, 218, 193, 0.4);
}

.button:active {
    transform: translateY(-0.5px) scale(0.99);
}

/* ТЕКСТОВЫЕ БЛОКИ СНИЗУ */
.brand-info {
    margin-top: 35px;
    text-align: center;
    color: var(--text-white);
    opacity: 0.8;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
}

.brand-info .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--tiffany);
    box-shadow: 0 0 6px var(--tiffany);
}

.services {
    margin-top: 12px;
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--tiffany);
    font-weight: 600;
    opacity: 0.7;
}

/* КОПИРАЙТ */
.footer {
    margin-top: auto;
    padding-top: 60px;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--text-gray);
    opacity: 0.5;
}

/* АНИМАЦИЯ ПОЯВЛЕНИЯ */
@keyframes logoAppear {
    from {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 420px) {
    .container {
        padding-top: 35px;
        padding-left: 20px;
        padding-right: 20px;
    }
    .logo { width: 210px; }
    h1 { font-size: 34px; }
}
</style>
</head>

<body>

<div class="container">

    <img src="metiz-project-logo.png" alt="METIZ PROJECT" class="logo">

    <div class="line"></div>

    <h1>
        <span>Печатаем и режем</span>
        <span class="accent-text">под ваши задачи</span>
    </h1>

    <div class="subtitle">
        Наклейки • Печать • Плоттерная резка • Брендирование автомобилей
    </div>

    <div class="buttons">

        <a class="button btn-works" href="works.html">
            Посмотреть наши работы →
        </a>

        <a class="button btn-messenger" href="https://wa.me/79650050990" target="_blank">
            Написать в WhatsApp
        </a>

        <a class="button btn-messenger" href="https://t.me/metiz_project" target="_blank">
            Написать в Telegram
        </a>

        <a class="button btn-messenger" href="https://vk.ru/metiz_project" target="_blank">
            Написать во ВКонтакте
        </a>

    </div>

    <div class="brand-info">
        <span class="dot"></span>
        METIZ PROJECT
    </div>

    <div class="services">
        STICKERS / PRINT / BRANDING
    </div>

    <div class="footer">
        © METIZ PROJECT 2026
    </div>

</div>

</body>
</html>
