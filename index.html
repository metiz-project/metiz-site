<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<title>METIZ PROJECT</title>

<style>
:root {
    --black: #000000;
    --white: #ffffff;

    /* Чистый Tiffany */
    --tiffany: #72FFF4;
    --tiffany-light: #A8FFF9;

    --button-dark: #073B37;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #000000;
    color-scheme: dark;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #000000;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

.container {
    width: min(100%, 620px);
    min-height: 100vh;

    margin: 0 auto;

    padding: 25px 18px 22px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ==============================
   LOGO
============================== */

.logo {
    width: 245px;
    max-width: 80vw;
    height: auto;

    display: block;

    /*
       Яркий логотип.
       Без большого ореола.
    */

    filter:
        brightness(1.25)
        saturate(1.2)
        contrast(1.05);
}


/* ==============================
   DIVIDER
============================== */

.line {
    width: 58px;
    height: 3px;

    margin: 24px 0 25px;

    background: var(--tiffany);

    border-radius: 10px;

    box-shadow:
        0 0 6px rgba(114,255,244,.35);
}


/* ==============================
   TITLE
============================== */

h1 {
    width: 100%;

    margin: 0;

    text-align: center;

    font-size: clamp(34px, 8vw, 54px);

    line-height: .98;

    font-weight: 900;

    letter-spacing: -2.5px;

    color: var(--tiffany);

    text-shadow: none;
}

h1 span {
    display: block;

    margin-bottom: 7px;

    color: #ffffff;
}


/* ==============================
   SUBTITLE
============================== */

.subtitle {
    width: 100%;
    max-width: 560px;

    margin-top: 21px;

    text-align: center;

    font-size: 14px;

    line-height: 1.55;

    font-weight: 600;

    color: var(--tiffany-light);

    text-shadow: none;
}


/* ==============================
   BUTTONS
============================== */

.buttons {
    width: 100%;

    margin-top: 28px;

    display: flex;
    flex-direction: column;

    gap: 12px;
}


/*
   ОСНОВНЫЕ КНОПКИ

   Не используем SVG.
   Не используем огромный glow.
   Простая чистая Tiffany-кнопка.
*/

.button {
    width: 100%;

    min-height: 62px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0 18px;

    border-radius: 16px;

    text-decoration: none;

    background: var(--tiffany) !important;

    color: #00110F !important;

    border: 2px solid var(--tiffany-light) !important;

    font-size: 16px;

    font-weight: 900;

    letter-spacing: 0;

    text-shadow: none !important;

    -webkit-appearance: none;
    appearance: none;

    forced-color-adjust: none;

    /*
       Только лёгкая тень.
       Никакого зелёного тумана.
    */

    box-shadow:
        0 3px 12px rgba(114,255,244,.18);

    transition:
        transform .15s ease,
        background .15s ease;
}

.button:active {
    transform: scale(.985);
}

.button:hover {
    background: var(--tiffany-light) !important;
}


/* ==============================
   WORKS
============================== */

.works {
    background: #000000 !important;

    color: var(--tiffany-light) !important;

    border:
        2px solid var(--tiffany) !important;

    box-shadow:
        0 3px 12px rgba(114,255,244,.12);
}

.works:hover {
    background: #061B19 !important;
}


/* ==============================
   BRAND INFO
============================== */

.brand-info {
    margin-top: 27px;

    color: var(--tiffany-light);

    font-size: 10px;

    letter-spacing: 2.5px;
}

.dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 7px;

    border-radius: 50%;

    background: var(--tiffany);

    box-shadow: none;
}

.services {
    margin-top: 17px;

    color: var(--tiffany);

    font-size: 10px;

    letter-spacing: 3px;

    opacity: .72;
}


/* ==============================
   FOOTER
============================== */

.footer {
    margin-top: auto;

    padding-top: 40px;

    color: var(--tiffany);

    font-size: 9px;

    letter-spacing: 2px;

    opacity: .35;
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 420px) {

    .container {
        padding:
            24px
            17px
            20px;
    }

    .logo {
        width: 240px;
    }

    .line {
        margin:
            23px
            0
            23px;
    }

    h1 {
        font-size: 35px;
        letter-spacing: -2px;
    }

    .subtitle {
        margin-top: 19px;

        font-size: 14px;

        line-height: 1.5;
    }

    .buttons {
        margin-top: 27px;

        gap: 11px;
    }

    .button {
        min-height: 61px;

        border-radius: 15px;

        font-size: 16px;
    }

    .brand-info {
        margin-top: 26px;
    }

    .services {
        margin-top: 16px;
    }

    .footer {
        padding-top: 34px;
    }
}
</style>
</head>


<body>

<div class="container">


    <!-- LOGO -->

    <img
        src="metiz-project-logo.png"
        alt="METIZ PROJECT"
        class="logo"
    >


    <!-- DIVIDER -->

    <div class="line"></div>


    <!-- TITLE -->

    <h1>

        <span>
            Печатаем и режем
        </span>

        под ваши задачи

    </h1>


    <!-- DESCRIPTION -->

    <div class="subtitle">

        Наклейки • Печать • Плоттерная резка •
        Брендирование автомобилей

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <a
            class="button"
            href="https://wa.me/79650050990"
            target="_blank"
            rel="noopener"
        >
            Написать в WhatsApp
        </a>


        <a
            class="button"
            href="https://t.me/metiz_project"
            target="_blank"
            rel="noopener"
        >
            Написать в Telegram
        </a>


        <a
            class="button"
            href="https://vk.ru/metiz_project"
            target="_blank"
            rel="noopener"
        >
            ВКонтакте
        </a>


        <a
            class="button works"
            href="works.html"
        >
            Посмотреть наши работы →
        </a>

    </div>


    <!-- BRAND -->

    <div class="brand-info">

        <span class="dot"></span>

        METIZ PROJECT

    </div>


    <div class="services">

        STICKERS / PRINT / BRANDING

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © METIZ PROJECT 2026

    </div>


</div>

</body>
</html>
