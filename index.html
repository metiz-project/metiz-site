<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>METIZ PROJECT — наклейки, печать, брендирование</title>

<meta
    name="description"
    content="METIZ PROJECT — производство наклеек для автомобилей, рекламы и витрин. Печать, плоттерная резка, брендирование и печать картин на холсте."
>

<meta name="theme-color" content="#050707">

<!-- =========================================================
     METIZ PROJECT
     ФИРМЕННАЯ ВИЗИТКА
     ========================================================= -->

<style>

/* =========================================================
   01. НАСТРОЙКИ
   ========================================================= */

:root {

    --tiffany: #4cd5d3;
    --tiffany-bright: #69f4ee;
    --tiffany-dark: #20aaa8;

    --background: #030606;
    --background-2: #09100f;

    --white: #ffffff;
    --muted: #8d9a97;
    --muted-dark: #46514f;

    --black: #020505;

    --border:
        rgba(255,255,255,.11);

    --glass:
        rgba(255,255,255,.045);

    --glass-hover:
        rgba(76,213,211,.10);

    --radius: 17px;

    --ease:
        cubic-bezier(.22,1,.36,1);

}


/* =========================================================
   02. RESET
   ========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html {
    min-height: 100%;
    scroll-behavior: smooth;
}


body {

    min-height: 100vh;

    color: var(--white);

    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(76,213,211,.13),
            transparent 29%
        ),

        radial-gradient(
            circle at 10% 85%,
            rgba(76,213,211,.055),
            transparent 25%
        ),

        linear-gradient(
            145deg,
            var(--background),
            var(--background-2)
        );

}


/* =========================================================
   03. СЕТКА
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -10;

    opacity: .24;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 52px 52px;

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 35%,
            transparent 90%
        );

}


/* =========================================================
   04. ДОПОЛНИТЕЛЬНАЯ СЕТКА / ШУМ
   ========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 50;

    opacity: .035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

    mix-blend-mode: screen;

}


/* =========================================================
   05. СВЕЧЕНИЯ
   ========================================================= */

.glow {

    position: fixed;

    width: 520px;
    height: 520px;

    left: var(--mouse-x, 50%);
    top: var(--mouse-y, 38%);

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(76,213,211,.19) 0%,
            rgba(76,213,211,.07) 30%,
            transparent 68%
        );

    filter: blur(30px);

    opacity: .85;

    pointer-events: none;

    z-index: -4;

    transition:
        left 1.2s var(--ease),
        top 1.2s var(--ease);

    animation:
        glowBreath 8s ease-in-out infinite alternate;

}


.glow::after {

    content: "";

    position: absolute;

    inset: 25%;

    border-radius: 50%;

    background: var(--tiffany);

    filter: blur(110px);

    opacity: .12;

}


@keyframes glowBreath {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.88);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1.15);
    }

}


/* =========================================================
   06. СВЕТЯЩИЕСЯ ТОЧКИ
   ========================================================= */

.ambient {

    position: fixed;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: var(--tiffany);

    box-shadow:
        0 0 12px var(--tiffany),
        0 0 35px rgba(76,213,211,.7);

    opacity: .4;

    pointer-events: none;

    z-index: -1;

}


.ambient.one {
    left: 13%;
    top: 25%;
    animation: floatOne 7s ease-in-out infinite;
}

.ambient.two {
    right: 14%;
    top: 17%;
    animation: floatTwo 9s ease-in-out infinite;
}

.ambient.three {
    left: 80%;
    bottom: 20%;
    animation: floatThree 8s ease-in-out infinite;
}


@keyframes floatOne {

    0%,100% {
        transform: translate3d(0,0,0);
        opacity: .2;
    }

    50% {
        transform: translate3d(14px,-22px,0);
        opacity: .65;
    }

}


@keyframes floatTwo {

    0%,100% {
        transform: translate3d(0,0,0);
        opacity: .25;
    }

    50% {
        transform: translate3d(-18px,18px,0);
        opacity: .7;
    }

}


@keyframes floatThree {

    0%,100% {
        transform: translate3d(0,0,0);
        opacity: .15;
    }

    50% {
        transform: translate3d(12px,-18px,0);
        opacity: .6;
    }

}


/* =========================================================
   07. ВИЗИТКА
   ========================================================= */

.page {

    min-height: 100vh;

    display: grid;

    place-items: center;

    padding:
        28px 14px;

}


.card {

    position: relative;

    width:
        min(
            520px,
            100%
        );

    min-height:
        calc(100vh - 56px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        38px 0;

}


/* =========================================================
   08. ВЕРХНЯЯ ЛИНИЯ
   ========================================================= */

.top-line {

    position: absolute;

    top: 0;

    left: 50%;

    width: 70px;

    height: 1px;

    transform:
        translateX(-50%)
        scaleX(0);

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--tiffany),
            transparent
        );

    box-shadow:
        0 0 18px rgba(76,213,211,.65);

    animation:
        lineReveal 1.2s
        var(--ease)
        .2s
        forwards;

}


@keyframes lineReveal {

    to {
        transform:
            translateX(-50%)
            scaleX(1);
    }

}


/* =========================================================
   09. ЛОГОТИП
   ========================================================= */

.logo-wrap {

    position: relative;

    opacity: 0;

    transform:
        translateY(-22px)
        scale(.94);

    animation:
        logoReveal 1.1s
        var(--ease)
        .15s
        forwards;

}


.logo-wrap::before {

    content: "";

    position: absolute;

    inset:
        12% -8%;

    border-radius: 50%;

    background:
        rgba(76,213,211,.16);

    filter: blur(35px);

    opacity: .65;

    z-index: -1;

}


.logo {

    width:
        min(
            275px,
            72vw
        );

    height: auto;

    display: block;

    filter:
        drop-shadow(
            0 0 16px
            rgba(76,213,211,.14)
        );

    transition:
        transform .8s var(--ease),
        filter .8s var(--ease);

}


.logo-wrap:hover .logo {

    transform:
        scale(1.035);

    filter:
        drop-shadow(
            0 0 26px
            rgba(76,213,211,.28)
        );

}


@keyframes logoReveal {

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   10. РАЗДЕЛИТЕЛЬ
   ========================================================= */

.line {

    position: relative;

    width: 46px;

    height: 2px;

    margin:
        25px 0 20px;

    overflow: hidden;

    background:
        rgba(76,213,211,.35);

    opacity: 0;

    animation:
        fadeUp .8s
        var(--ease)
        .42s
        forwards;

}


.line::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            transparent
        );

    transform:
        translateX(-100%);

    animation:
        lineShine 2.4s
        ease-in-out
        1.1s
        infinite;

}


@keyframes lineShine {

    to {
        transform:
            translateX(100%);
    }

}


/* =========================================================
   11. ЗАГОЛОВОК
   ========================================================= */

.title {

    max-width: 500px;

    font-size:
        clamp(
            30px,
            7vw,
            43px
        );

    line-height:
        .98;

    font-weight: 850;

    letter-spacing:
        -.055em;

    opacity: 0;

    transform:
        translateY(22px);

    animation:
        fadeUp .9s
        var(--ease)
        .48s
        forwards;

}


.title span {

    display: inline-block;

    color:
        var(--tiffany);

    text-shadow:
        0 0 28px
        rgba(76,213,211,.16);

}


/* =========================================================
   12. ОПИСАНИЕ
   ========================================================= */

.subtitle {

    max-width: 390px;

    margin-top: 15px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.55;

    letter-spacing: .01em;

    opacity: 0;

    transform:
        translateY(18px);

    animation:
        fadeUp .9s
        var(--ease)
        .62s
        forwards;

}


.subtitle strong {

    color:
        #c8d2d0;

    font-weight: 600;

}


/* =========================================================
   13. КНОПКИ
   ========================================================= */

.buttons {

    width: 100%;

    margin-top: 27px;

    display: flex;

    flex-direction: column;

    gap: 10px;

    opacity: 0;

    transform:
        translateY(25px);

    animation:
        fadeUp .95s
        var(--ease)
        .76s
        forwards;

}


/* =========================================================
   14. КНОПКА
   ========================================================= */

.button {

    --mx: 50%;
    --my: 50%;

    position: relative;

    width: 100%;

    min-height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

    padding:
        0 22px;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color: var(--white);

    font-size: 14px;

    font-weight: 750;

    text-decoration: none;

    letter-spacing:
        -.01em;

    overflow: hidden;

    isolation: isolate;

    backdrop-filter:
        blur(18px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(130%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 35px rgba(0,0,0,.12);

    transform:
        translateZ(0);

    transition:
        transform .42s var(--ease),
        border-color .42s ease,
        background .42s ease,
        box-shadow .42s ease;

    cursor: pointer;

}


/* Световой слой */

.button::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            170px circle at var(--mx) var(--my),
            rgba(76,213,211,.25),
            transparent 65%
        );

    opacity: 0;

    transition:
        opacity .35s ease;

    z-index: -1;

}


/* Блик */

.button::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 55%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );

    transform:
        skewX(-18deg);

    transition:
        left .7s var(--ease);

    pointer-events: none;

}


/* =========================================================
   15. HOVER
   ========================================================= */

.button:hover {

    transform:
        translateY(-3px)
        scale(1.006);

    border-color:
        rgba(76,213,211,.45);

    background:
        linear-gradient(
            135deg,
            rgba(76,213,211,.105),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 14px 40px
        rgba(0,0,0,.25),

        0 0 30px
        rgba(76,213,211,.07);

}


.button:hover::before {
    opacity: 1;
}


.button:hover::after {
    left: 125%;
}


/* =========================================================
   16. ИКОНКИ
   ========================================================= */

.icon {

    width: 21px;

    height: 21px;

    flex:
        0 0 21px;

    display:
        grid;

    place-items:
        center;

}


.icon svg {

    width: 100%;
    height: 100%;

    fill: currentColor;

}


/* =========================================================
   17. TIFFANY-КНОПКИ
   ========================================================= */

.button.primary {

    color:
        #03100e;

    border-color:
        rgba(76,213,211,.9);

    background:
        linear-gradient(
            135deg,
            #55dad7,
            #45cbc9
        );

    box-shadow:
        0 10px 32px
        rgba(76,213,211,.11),

        inset 0 1px 0
        rgba(255,255,255,.35);

}


.button.primary::before {

    background:
        radial-gradient(
            190px circle at var(--mx) var(--my),
            rgba(255,255,255,.30),
            transparent 65%
        );

}


.button.primary:hover {

    color:
        #001513;

    border-color:
        var(--tiffany-bright);

    background:
        linear-gradient(
            135deg,
            #69e8e4,
            #4cd5d3
        );

    box-shadow:
        0 16px 42px
        rgba(76,213,211,.24),

        0 0 30px
        rgba(76,213,211,.12);

}


/* =========================================================
   18. ТЕКСТОВАЯ КНОПКА
   ========================================================= */

.button.works {

    color:
        #dce5e3;

    background:
        rgba(255,255,255,.035);

}


.button.works .arrow {

    color:
        var(--tiffany);

    transition:
        transform .4s var(--ease);

}


.button.works:hover .arrow {

    transform:
        translateX(6px);

}


/* =========================================================
   19. СТАТУС
   ========================================================= */

.status {

    display:
        inline-flex;

    align-items:
        center;

    gap: 8px;

    margin-top:
        24px;

    color:
        #53ff2d;

    font-size:
        9px;

    font-weight:
        700;

    letter-spacing:
        .16em;

    text-transform:
        uppercase;

    opacity: 0;

    animation:
        fadeUp .8s
        var(--ease)
        1.02s
        forwards;

}


.status-dot {

    position:
        relative;

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #43ff25;

    box-shadow:
        0 0 8px #43ff25,
        0 0 18px #43ff25;

}


.status-dot::after {

    content: "";

    position:
        absolute;

    inset:
        -5px;

    border:
        1px solid
        rgba(67,255,37,.25);

    border-radius:
        50%;

    animation:
        statusPulse 2s
        ease-out
        infinite;

}


@keyframes statusPulse {

    0% {
        transform:
            scale(.65);
        opacity:
            .9;
    }

    100% {
        transform:
            scale(1.8);
        opacity:
            0;
    }

}


/* =========================================================
   20. МАЛЕНЬКАЯ ПОДПИСЬ
   ========================================================= */

.small {

    margin-top:
        17px;

    color:
        #5d6966;

    font-size:
        9px;

    font-weight:
        600;

    letter-spacing:
        .22em;

    text-transform:
        uppercase;

    opacity: 0;

    animation:
        fadeUp .8s
        var(--ease)
        1.12s
        forwards;

}


/* =========================================================
   21. ФУТЕР
   ========================================================= */

.footer {

    margin-top:
        auto;

    padding-top:
        32px;

    color:
        #3e4846;

    font-size:
        8px;

    font-weight:
        600;

    letter-spacing:
        .18em;

    text-transform:
        uppercase;

    opacity: 0;

    animation:
        fadeUp .8s
        var(--ease)
        1.22s
        forwards;

}


/* =========================================================
   22. АНИМАЦИЯ ПОЯВЛЕНИЯ
   ========================================================= */

@keyframes fadeUp {

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   23. КНОПКА НАЗАД / ФОКУС
   ========================================================= */

.button:focus-visible {

    outline:
        2px solid
        var(--tiffany-bright);

    outline-offset:
        4px;

}


/* =========================================================
   24. VIEW TRANSITIONS
   ========================================================= */

/*
   Современная система переходов между страницами.
   Поддерживается современными браузерами.
*/

@view-transition {
    navigation: auto;
}


::view-transition-old(root),
::view-transition-new(root) {

    animation-duration:
        .55s;

}


::view-transition-old(root) {

    animation-name:
        pageOut;

}


::view-transition-new(root) {

    animation-name:
        pageIn;

}


@keyframes pageOut {

    from {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

    to {
        opacity: 0;
        transform: scale(.985);
        filter: blur(7px);
    }

}


@keyframes pageIn {

    from {
        opacity: 0;
        transform: scale(1.015);
        filter: blur(7px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

}


/* =========================================================
   25. МОБИЛЬНЫЕ
   ========================================================= */

@media (max-width: 520px) {

    .page {

        padding:
            18px 14px;

    }


    .card {

        min-height:
            calc(100vh - 36px);

        padding:
            28px 0;

    }


    .logo {

        width:
            235px;

    }


    .line {

        margin:
            22px 0 18px;

    }


    .title {

        font-size:
            clamp(
                29px,
                8vw,
                36px
            );

    }


    .subtitle {

        max-width:
            340px;

        font-size:
            12px;

    }


    .buttons {

        margin-top:
            25px;

        gap:
            9px;

    }


    .button {

        min-height:
            57px;

        border-radius:
            15px;

        font-size:
            13px;

    }


    .footer {

        padding-top:
            26px;

    }

}


/* =========================================================
   26. ОЧЕНЬ МАЛЕНЬКИЕ ЭКРАНЫ
   ========================================================= */

@media (max-height: 720px) {

    .card {

        padding:
            20px 0;

    }


    .logo {

        width:
            210px;

    }


    .line {

        margin:
            16px 0 14px;

    }


    .subtitle {

        margin-top:
            10px;

    }


    .buttons {

        margin-top:
            20px;

    }


    .button {

        min-height:
            52px;

    }


    .status {

        margin-top:
            17px;

    }


    .small {

        margin-top:
            12px;

    }


    .footer {

        padding-top:
            20px;

    }

}


/* =========================================================
   27. REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;

        scroll-behavior:
            auto !important;

    }

}


/* =========================================================
   28. СКРЫТЫЙ TEXT SELECTION
   ========================================================= */

::selection {

    color:
        #00100e;

    background:
        var(--tiffany);

}

</style>
</head>


<body>

<!-- =========================================================
     СВЕЧЕНИЯ
     ========================================================= -->

<div class="glow"></div>

<div class="ambient one"></div>
<div class="ambient two"></div>
<div class="ambient three"></div>


<main class="page">

<div class="card">

    <div class="top-line"></div>


    <!-- =====================================================
         ЛОГОТИП
         ===================================================== -->

    <div class="logo-wrap">

        <img
            src="metiz-project-logo.png"
            alt="METIZ PROJECT"
            class="logo"
        >

    </div>


    <!-- =====================================================
         РАЗДЕЛИТЕЛЬ
         ===================================================== -->

    <div class="line"></div>


    <!-- =====================================================
         ЗАГОЛОВОК
         ===================================================== -->

    <h1 class="title">

        Печатаем и режем
        <br>

        <span>под ваши задачи</span>

    </h1>


    <!-- =====================================================
         ОПИСАНИЕ
         ===================================================== -->

    <p class="subtitle">

        <strong>Наклейки для авто</strong> •
        реклама • витрины •
        печать на холсте •
        плоттерная резка

    </p>


    <!-- =====================================================
         КНОПКИ
         ===================================================== -->

    <div class="buttons">


        <!-- =================================================
             VK — ГРУППА
             ================================================= -->

        <a
            href="https://vk.ru/metiz_project"
            target="_blank"
            rel="noopener noreferrer"
            class="button primary"
            data-magnetic
            aria-label="Открыть группу METIZ PROJECT ВКонтакте"
        >

            <span class="icon">

                <!-- VK -->

                <svg
                    viewBox="0 0 24 24"

<script>

/* =========================================================
   METIZ PROJECT
   ИНТЕРАКТИВ
   ========================================================= */


/* =========================================================
   01. ДВИЖЕНИЕ TIFFANY-СВЕЧЕНИЯ
   ========================================================= */

const root = document.documentElement;

let mouseX = 50;
let mouseY = 38;

let targetX = 50;
let targetY = 38;

let ticking = false;


function animateGlow() {

    mouseX +=
        (targetX - mouseX) * 0.045;

    mouseY +=
        (targetY - mouseY) * 0.045;

    root.style.setProperty(
        "--mouse-x",
        mouseX + "%"
    );

    root.style.setProperty(
        "--mouse-y",
        mouseY + "%"
    );

    requestAnimationFrame(
        animateGlow
    );
}


animateGlow();


window.addEventListener(
    "pointermove",
    (event) => {

        targetX =
            (event.clientX / window.innerWidth) * 100;

        targetY =
            (event.clientY / window.innerHeight) * 100;

    },
    {
        passive: true
    }
);


/* =========================================================
   02. МАГНИТНЫЕ КНОПКИ
   ========================================================= */

const magneticButtons =
    document.querySelectorAll(
        "[data-magnetic]"
    );


magneticButtons.forEach(
    (button) => {

        button.addEventListener(
            "pointermove",
            (event) => {

                const rect =
                    button.getBoundingClientRect();

                const x =
                    event.clientX - rect.left;

                const y =
                    event.clientY - rect.top;

                const px =
                    (x / rect.width) * 100;

                const py =
                    (y / rect.height) * 100;

                button.style.setProperty(
                    "--mx",
                    px + "%"
                );

                button.style.setProperty(
                    "--my",
                    py + "%"
                );

                const moveX =
                    (x - rect.width / 2) * 0.045;

                const moveY =
                    (y - rect.height / 2) * 0.045;

                button.style.transform =
                    `translate(${moveX}px, ${moveY}px) scale(1.006)`;

            },
            {
                passive: true
            }
        );


        button.addEventListener(
            "pointerleave",
            () => {

                button.style.transform =
                    "";

            }
        );

    }
);


/* =========================================================
   03. RIPPLE ПРИ НАЖАТИИ
   ========================================================= */

magneticButtons.forEach(
    (button) => {

        button.addEventListener(
            "pointerdown",
            (event) => {

                const rect =
                    button.getBoundingClientRect();

                const ripple =
                    document.createElement("span");

                const size =
                    Math.max(
                        rect.width,
                        rect.height
                    ) * 1.4;

                ripple.style.position =
                    "absolute";

                ripple.style.width =
                    size + "px";

                ripple.style.height =
                    size + "px";

                ripple.style.left =
                    (event.clientX - rect.left - size / 2) + "px";

                ripple.style.top =
                    (event.clientY - rect.top - size / 2) + "px";

                ripple.style.borderRadius =
                    "50%";

                ripple.style.background =
                    "rgba(255,255,255,.22)";

                ripple.style.transform =
                    "scale(0)";

                ripple.style.pointerEvents =
                    "none";

                ripple.style.zIndex =
                    "2";

                ripple.style.animation =
                    "rippleEffect .65s ease-out forwards";

                button.appendChild(
                    ripple
                );

                setTimeout(
                    () => {
                        ripple.remove();
                    },
                    700
                );

            }
        );

    }
);


/* =========================================================
   04. CSS ДЛЯ RIPPLE
   ========================================================= */

const rippleStyle =
    document.createElement("style");


rippleStyle.textContent = `

@keyframes rippleEffect {

    from {
        transform: scale(0);
        opacity: .8;
    }

    to {
        transform: scale(1);
        opacity: 0;
    }

}

`;


document.head.appendChild(
    rippleStyle
);


/* =========================================================
   05. НЕБОЛЬШОЙ PARALLAX
   ========================================================= */

const logo =
    document.querySelector(".logo-wrap");

const card =
    document.querySelector(".card");


window.addEventListener(
    "pointermove",
    (event) => {

        if (
            window.innerWidth < 700 ||
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        ) {
            return;
        }

        const x =
            (event.clientX / window.innerWidth - .5);

        const y =
            (event.clientY / window.innerHeight - .5);

        card.style.transform =
            `perspective(1200px)
             rotateX(${y * -1.3}deg)
             rotateY(${x * 1.3}deg)`;

    },
    {
        passive: true
    }
);


window.addEventListener(
    "pointerleave",
    () => {

        card.style.transform =
            "";

    }
);


/* =========================================================
   06. VIEW TRANSITION
   Дополнительная поддержка переходов
   ========================================================= */

document.addEventListener(
    "click",
    (event) => {

        const link =
            event.target.closest("a");

        if (!link) {
            return;
        }

        const url =
            new URL(
                link.href,
                window.location.href
            );

        const isExternal =
            url.origin !== window.location.origin;

        const isNewTab =
            link.target === "_blank";

        if (
            isExternal ||
            isNewTab ||
            link.hasAttribute("download")
        ) {
            return;
        }

        if (
            !document.startViewTransition
        ) {
            return;
        }

        event.preventDefault();

        document.startViewTransition(
            () => {

                window.location.href =
                    link.href;

            }
        );

    }
);


/* =========================================================
   07. УБИРАЕМ ПАРАЛЛАКС НА TOUCH
   ========================================================= */

window.addEventListener(
    "touchstart",
    () => {

        card.style.transform =
            "";

    },
    {
        passive: true
    }
);

</script>
