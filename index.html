<!DOCTYPE html>
<html lang="ru">

<head>

    <!-- =========================================================
         METIZ PROJECT — DIGITAL BUSINESS CARD
         =========================================================
         ОСНОВНОЙ ФАЙЛ САЙТА

         Здесь находятся:
         1. Настройки цветов
         2. Фон
         3. Анимации
         4. Логотип
         5. Кнопки
         6. JavaScript

         ВАЖНО:
         Все основные настройки я подписываю комментариями,
         чтобы потом тебе было легко самому их находить.
         ========================================================= -->

    <meta charset="UTF-8">

    <!-- Правильный масштаб страницы на телефоне -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>METIZ PROJECT</title>


    <style>


        /* =========================================================
           ОСНОВНЫЕ НАСТРОЙКИ
           ========================================================= */

        :root {

            /* =====================================================
               ЦВЕТ КНОПОК
               ===================================================== */

            --tiffany: #4cd5d3;


            /* =====================================================
               НАЧАЛО ЦВЕТА ГРАДИЕНТА
               ОТ ВЕРХНЕГО ЛЕВОГО УГЛА
               ===================================================== */

            --background: #050707;


            /* =====================================================
               КОНЕЦ ЦВЕТА ГРАДИЕНТА
               В НИЖНЕМ ПРАВОМ УГЛУ
               ===================================================== */

            --background-2: #0b0f0e;


            /* =====================================================
               ЦВЕТ ЗАГОЛОВКА И ОСНОВНОГО ТЕКСТА
               ===================================================== */

            --text: #ffffff;


            /* =====================================================
               ЦВЕТ ВТОРОСТЕПЕННОГО ТЕКСТА

               Это цвет текста:
               "Наклейки • Печать • Плоттерная резка"
               ===================================================== */

            --muted: #9ca7a4;


            /* =====================================================
               ТЁМНЫЙ ФОН ОБЫЧНЫХ КНОПОК
               ===================================================== */

            --button-dark: rgba(255,255,255,0.06);


            /* =====================================================
               ЦВЕТ ОБВОДКИ
               ===================================================== */

            --border: rgba(255,255,255,0.12);
        }



        /* =========================================================
           СБРОС СТАНДАРТНЫХ СТИЛЕЙ
           ========================================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }



        html,
        body {

            width: 100%;

            min-height: 100%;
        }



        /* =========================================================
           ОСНОВНОЙ ФОН СТРАНИЦЫ
           ========================================================= */

        body {

            position: relative;

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            /*
             ВАЖНО:
             Фон остаётся тёмным.

             Tiffany-свет будет отдельными слоями,
             поэтому логотип не должен выгорать.
            */

            background:

                linear-gradient(
                    145deg,
                    var(--background),
                    var(--background-2)
                );

            color-scheme: only light;
        }



        /* =========================================================
           ТЕХНОЛОГИЧЕСКАЯ СЕТКА НА ФОНЕ
           ========================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(76,213,211,0.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(76,213,211,0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            opacity: 0.45;
        }



        /* =========================================================
           ЖИВОЙ TIFFANY
           СВЕТ №1
           =========================================================

           Этот свет специально сделан достаточно большим,
           чтобы его движение было видно.

           Он НЕ находится поверх логотипа как отдельная подсветка.
           Это именно фон.
           ========================================================= */

        .tiffany-light-1 {

            position: fixed;

            z-index: 1;

            pointer-events: none;

            width: 520px;

            height: 520px;

            left: -260px;

            top: 15%;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(76,213,211,0.30) 0%,
                    rgba(76,213,211,0.18) 22%,
                    rgba(76,213,211,0.08) 42%,
                    rgba(76,213,211,0.025) 58%,
                    transparent 73%
                );

            filter: blur(25px);

            opacity: 1;

            animation:

                tiffanyMoveOne
                11s
                ease-in-out
                infinite
                alternate;

            will-change: transform;
        }



        /* =========================================================
           ЖИВОЙ TIFFANY
           СВЕТ №2
           =========================================================

           Второй источник двигается навстречу первому.
           ========================================================= */

        .tiffany-light-2 {

            position: fixed;

            z-index: 1;

            pointer-events: none;

            width: 570px;

            height: 570px;

            right: -300px;

            bottom: 8%;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(76,213,211,0.26) 0%,
                    rgba(76,213,211,0.15) 22%,
                    rgba(76,213,211,0.065) 43%,
                    rgba(76,213,211,0.02) 60%,
                    transparent 75%
                );

            filter: blur(28px);

            opacity: 1;

            animation:

                tiffanyMoveTwo
                14s
                ease-in-out
                infinite
                alternate;

            will-change: transform;
        }



        /* =========================================================
           СВЕТ №3
           ЦЕНТРАЛЬНОЕ МЯГКОЕ СВЕЧЕНИЕ
           =========================================================

           Очень слабое.
           Нужен только для глубины фона.
           ========================================================= */

        .tiffany-light-3 {

            position: fixed;

            z-index: 1;

            pointer-events: none;

            width: 300px;

            height: 300px;

            left: 50%;

            top: 42%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(76,213,211,0.12),
                    transparent 70%
                );

            filter: blur(35px);

            animation:

                centerTiffanyPulse
                7s
                ease-in-out
                infinite
                alternate;

            will-change: transform, opacity;
        }



        /* =========================================================
           ДВИЖЕНИЕ СВЕТА №1
           ========================================================= */

        @keyframes tiffanyMoveOne {

            0% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(0.9);
            }

            50% {

                transform:
                    translate3d(
                        300px,
                        40px,
                        0
                    )
                    scale(1.08);
            }

            100% {

                transform:
                    translate3d(
                        180px,
                        300px,
                        0
                    )
                    scale(0.96);
            }
        }



        /* =========================================================
           ДВИЖЕНИЕ СВЕТА №2
           ========================================================= */

        @keyframes tiffanyMoveTwo {

            0% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(0.92);
            }

            50% {

                transform:
                    translate3d(
                        -300px,
                        -70px,
                        0
                    )
                    scale(1.1);
            }

            100% {

                transform:
                    translate3d(
                        -180px,
                        -310px,
                        0
                    )
                    scale(0.95);
            }
        }



        /* =========================================================
           ПУЛЬСАЦИЯ ЦЕНТРАЛЬНОГО СВЕТА
           ========================================================= */

        @keyframes centerTiffanyPulse {

            0% {

                opacity: 0.35;

                transform:
                    translate(-50%, -50%)
                    scale(0.85);
            }

            100% {

                opacity: 0.85;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }



        /* =========================================================
           ОСНОВНАЯ КАРТОЧКА
           ========================================================= */

        .card {

            position: relative;

            z-index: 3;

            width:
                min(
                    520px,
                    calc(100% - 28px)
                );

            min-height: 100vh;

            margin: 0 auto;

            /*
             ВАЖНО:
             Здесь уменьшил верхний отступ.

             Поэтому логотип снова будет выше,
             а сверху не будет большой пустоты.
            */

            padding:
                24px 0
                28px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }



        /* =========================================================
           ЛОГОТИП
           ========================================================= */

        .logo-wrap {

            width: 100%;

            display: flex;

            justify-content: center;

            animation:

                logoAppear
                0.8s
                ease
                both;
        }



        .logo {

            width:
                min(
                    270px,
                    70vw
                );

            height: auto;

            display: block;

            /*
             ВАЖНО:

             ИСПОЛЬЗУЕМ ОРИГИНАЛЬНЫЙ ЛОГОТИП.

             Сам логотип НЕ ПЕРЕКРАШИВАЕМ.
             */

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(76,213,211,0.15)
                );
        }



        /* =========================================================
           ПОЯВЛЕНИЕ ЛОГОТИПА
           ========================================================= */

        @keyframes logoAppear {

            from {

                opacity: 0;

                transform:
                    translateY(-10px)
                    scale(0.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }



        /* =========================================================
           ЛИНИЯ ПОД ЛОГОТИПОМ
           ========================================================= */

        .line {

            width: 45px;

            height: 2px;

            margin:
                20px 0
                18px;

            background:
                #4cd5d3;

            border-radius: 10px;

            box-shadow:
                0 0 10px
                rgba(76,213,211,0.45);

            animation:

                lineAppear
                0.8s
                ease
                0.15s
                both;
        }



        @keyframes lineAppear {

            from {

                opacity: 0;

                transform:
                    scaleX(0);
            }

            to {

                opacity: 1;

                transform:
                    scaleX(1);
            }
        }



        /* =========================================================
           ГЛАВНЫЙ ЗАГОЛОВОК
           ========================================================= */

        .title {

            font-size:
                clamp(
                    25px,
                    7vw,
                    38px
                );

            line-height: 1.05;

            font-weight: 800;

            letter-spacing: -0.8px;

            animation:

                titleAppear
                0.8s
                ease
                0.2s
                both;
        }



        /* ВТОРАЯ СТРОКА — TIFFANY */

        .title span {

            color:
                #4cd5d3;
        }



        /* =========================================================
           ПОЯВЛЕНИЕ ЗАГОЛОВКА
           ========================================================= */

        @keyframes titleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }



        /* =========================================================
           ПОДЗАГОЛОВОК
           ========================================================= */

        .subtitle {

            margin-top: 13px;

            color:
                var(--muted);

            font-size: 13px;

            line-height: 1.5;

            animation:

                subtitleAppear
                0.8s
                ease
                0.3s
                both;
        }



        @keyframes subtitleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(7px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }



        /* =========================================================
           БЛОК КНОПОК
           ========================================================= */

        .buttons {

            width: 100%;

            margin-top: 27px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            animation:

                buttonsAppear
                0.8s
                ease
                0.4s
                both;
        }



        @keyframes buttonsAppear {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }



        /* =========================================================
           ОБЩАЯ КНОПКА
           ========================================================= */

        .button {

            position: relative;

            min-height: 58px;

            padding:
                0 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 15px;

            border:
                1px solid
                var(--border);

            background:
                var(--button-dark);

            color:
                #ffffff;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.1px;

            overflow: hidden;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            transition:

                transform
                0.22s
                ease,

                box-shadow
                0.22s
                ease,

                border-color
                0.22s
                ease;
        }



        /* =========================================================
           ЯРКАЯ TIFFANY-КНОПКА
           ========================================================= */

        .button.primary {

            background:
                #4cd5d3;

            color:
                #03100d;

            border-color:
                #4cd5d3;

            box-shadow:
                0 8px 24px
                rgba(76,213,211,0.18);
        }



        /* =========================================================
           НАВЕДЕНИЕ НА КНОПКУ
           ========================================================= */

        .button:hover {

            border-color:
                var(--tiffany);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 28px
                rgba(76,213,211,0.14);
        }



        /* =========================================================
           НАЖАТИЕ НА КНОПКУ
           ========================================================= */

        .button:active {

            transform:
                translateY(1px)
                scale(0.99);
        }



        /* =========================================================
           НАВЕДЕНИЕ НА ЯРКУЮ КНОПКУ
           ========================================================= */

        .button.primary:hover {

            background:
                #00eaff;

            border-color:
                #00eaff;

            box-shadow:
                0 10px 34px
                rgba(0,234,255,0.25);
        }



        /* =========================================================
           ТЕКСТ ПОД КНОПКАМИ
           ========================================================= */

        .small {

            margin-top: 22px;

            color:
                #606b68;

            font-size: 10px;

            line-height: 1.4;

            text-transform: uppercase;

            letter-spacing: 1.2px;
        }



        /* =========================================================
           СТАТУС ONLINE
           ========================================================= */

        .status {

            margin-top: 25px;

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                #37ff00;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;
        }



        /* ЗЕЛЁНАЯ ТОЧКА */

        .status-dot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background:
                #37ff00;

            box-shadow:
                0 0 10px
                rgba(55,255,0,0.8);

            animation:

                onlinePulse
                1.8s
                ease-in-out
                infinite;
        }



        /* =========================================================
           АНИМАЦИЯ ONLINE
           ========================================================= */

        @keyframes onlinePulse {

            0%,
            100% {

                opacity: 1;

                transform:
                    scale(1);
            }

            50% {

                opacity: 0.45;

                transform:
                    scale(0.75);
            }
        }



        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {

            margin-top: auto;

            padding-top: 30px;

            color:
                #464f4d;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.8px;
        }



        /* =========================================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ========================================================= */

        @media (max-width: 500px) {

            .card {

                width:
                    calc(100% - 30px);

                /*
                 ВЕРХНИЙ ОТСТУП НА ТЕЛЕФОНЕ

                 Здесь специально небольшой отступ,
                 чтобы логотип не уезжал вниз.
                */

                padding:
                    18px 0
                    24px;
            }



            .logo {

                width: 230px;
            }



            .title {

                font-size: 27px;
            }



            .subtitle {

                font-size: 13px;
            }



            .button {

                min-height: 56px;

                border-radius: 14px;
            }



            /*
             Свет на телефоне чуть уменьшаем,
             но оставляем его достаточно заметным.
            */

            .tiffany-light-1 {

                width: 430px;

                height: 430px;

                left: -240px;

                opacity: 0.95;
            }



            .tiffany-light-2 {

                width: 450px;

                height: 450px;

                right: -250px;

                opacity: 0.9;
            }



            .tiffany-light-3 {

                width: 260px;

                height: 260px;
            }
        }



        /* =========================================================
           ЕСЛИ В ТЕЛЕФОНЕ ВКЛЮЧЕНО
           "УМЕНЬШЕНИЕ ДВИЖЕНИЯ"

           Тогда браузер уменьшает анимации.
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }


    </style>

</head>


<body>


    <!-- =========================================================
         ЖИВОЙ TIFFANY
         =========================================================
         ТРИ СЛОЯ СВЕТА НА ЗАДНЕМ ФОНЕ.

         Они находятся ПОЗАДИ карточки сайта.
         Логотип и кнопки не должны выгорать.
         ========================================================= -->

    <div class="tiffany-light-1"></div>

    <div class="tiffany-light-2"></div>

    <div class="tiffany-light-3"></div>



    <!-- =========================================================
         ОСНОВНАЯ КАРТОЧКА
         ========================================================= -->

    <main class="card">


        <!-- =====================================================
             ЛОГОТИП
             ===================================================== -->

        <div class="logo-wrap">

            <img
                class="logo"
                src="metiz-project-logo.png"
                alt="METIZ PROJECT"
            >

        </div>



        <!-- =====================================================
             ЛИНИЯ ПОД ЛОГОТИПОМ
             ===================================================== -->

        <div class="line"></div>



        <!-- =====================================================
             ГЛАВНЫЙ ЗАГОЛОВОК
             ===================================================== -->

        <h1 class="title">

            Печатаем и режем

            <br>

            <span>под ваши задачи</span>

        </h1>



        <!-- =====================================================
             ПОДЗАГОЛОВОК

             Здесь можно менять текст.
             ===================================================== -->

        <p class="subtitle">

            Наклейки • Печать • Плоттерная резка

        </p>



        <!-- =====================================================
             КНОПКИ
             ===================================================== -->

        <div class="buttons">


            <!-- =================================================
                 ГРУППА ВКОНТАКТЕ
                 ================================================= -->

            <a
                class="button primary"
                href="https://vk.ru/metiz_project"
                target="_blank"
                rel="noopener"
            >

                Группа ВКонтакте

            </a>



            <!-- =================================================
                 НАПИСАТЬ ВКОНТАКТЕ
                 ================================================= -->

            <a
                class="button primary"
                href="https://vk.ru/im?sel=-10150150"
                target="_blank"
                rel="noopener"
            >

                Написать ВКонтакте

            </a>



            <!-- =================================================
                 TELEGRAM
                 ================================================= -->

            <a
                class="button primary"
                href="https://t.me/metizproject"
                target="_blank"
                rel="noopener"
            >

                Написать в Telegram

            </a>



            <!-- =================================================
                 WHATSAPP
                 ================================================= -->

            <a
                class="button primary"
                href="https://wa.me/message/RDHE3F4PU2D3L1"
                target="_blank"
                rel="noopener"
            >

                Написать в WhatsApp

            </a>



            <!-- =================================================
                 НАШИ РАБОТЫ

                 Пока открываем временное сообщение.
                 Позже здесь сделаем красивый переход
                 на отдельную страницу.
                 ================================================= -->

            <a
                class="button"
                href="#"
                onclick="openWorks(event)"
            >

                Посмотреть наши работы →

            </a>


        </div>



        <!-- =====================================================
             ПОДПИСЬ
             ===================================================== -->

        <div class="small">

            Stickers / Print / Branding

        </div>



        <!-- =====================================================
             СТАТУС
             ===================================================== -->

        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>



        <!-- =====================================================
             НИЖНЯЯ НАДПИСЬ
             ===================================================== -->

        <div class="footer">

            © METIZ PROJECT 2010-2026

        </div>


    </main>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /* =======================================================
           КНОПКА "НАШИ РАБОТЫ"

           Пока отдельная страница ещё не готова.

           Позже здесь заменим alert на красивый переход
           между экранами.
           ======================================================= */

        function openWorks(event) {

            event.preventDefault();

            alert(
                "Раздел «Наши работы» скоро будет доступен."
            );
        }


    </script>


</body>

</html>
