<style>

/* =========================================================
   METIZ PROJECT
   НАСТРОЙКИ
========================================================= */

:root {

    --tiffany: #4cd5d3;

    --background: #050707;
    --background-2: #0b0f0e;

    --text: #ffffff;
    --muted: #9ca7a4;

    --button-dark: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
}


/* =========================================================
   ОСНОВА
========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;
}


html {

    scroll-behavior: smooth;
}


body {

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(67,218,193,0.12),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            var(--background),
            var(--background-2)
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

    /* АНИМАЦИЯ ПЕРЕХОДА МЕЖДУ СТРАНИЦАМИ */

    opacity: 1;

    transition:
        opacity .5s ease,
        transform .5s ease;
}


/* =========================================================
   ПЛАВНЫЙ УХОД СО СТРАНИЦЫ
========================================================= */

body.page-leaving {

    opacity: 0;

    transform:
        translateY(-10px);
}


/* =========================================================
   ФОНОВАЯ СЕТКА
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.22;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    z-index: -3;
}


/* =========================================================
   TIFFANY СВЕЧЕНИЕ
========================================================= */

.glow {

    position: fixed;

    width: 420px;
    height: 420px;

    left: 50%;
    top: 35%;

    transform:
        translate(-50%, -50%);

    background:
        var(--tiffany);

    filter:
        blur(180px);

    opacity:
        0.07;

    pointer-events:
        none;

    animation:
        glowMove 8s ease-in-out infinite alternate;

    z-index:
        -2;
}


@keyframes glowMove {

    from {

        transform:
            translate(-50%, -50%)
            scale(.9);
    }

    to {

        transform:
            translate(-48%, -53%)
            scale(1.15);
    }
}


/* =========================================================
   ВИЗИТКА
========================================================= */

.card {

    width:
        min(520px, calc(100% - 28px));

    min-height:
        100vh;

    margin:
        auto;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    text-align:
        center;

    padding:
        35px 0;
}


/* =========================================================
   ЛОГОТИП
========================================================= */

.logo-wrap {

    opacity:
        0;

    transform:
        translateY(-15px);

    animation:
        logoAppear 1s ease forwards;

    animation-delay:
        .15s;
}


.logo {

    width:
        min(270px, 70vw);

    height:
        auto;

    display:
        block;

    filter:
        drop-shadow(
            0 0 18px
            rgba(67,218,193,.12)
        );
}


@keyframes logoAppear {

    to {

        opacity:
            1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   РАЗДЕЛИТЕЛЬ
========================================================= */

.line {

    width:
        45px;

    height:
        2px;

    margin:
        25px 0 20px;

    background:
        var(--tiffany);

    box-shadow:
        0 0 14px
        rgba(67,218,193,.5);

    animation:
        lineAppear 1s ease forwards;

    animation-delay:
        .4s;

    opacity:
        0;

    transform:
        scaleX(0);
}


@keyframes lineAppear {

    to {

        opacity:
            1;

        transform:
            scaleX(1);
    }
}


/* =========================================================
   ЗАГОЛОВОК
========================================================= */

.title {

    font-size:
        clamp(25px, 7vw, 38px);

    line-height:
        1.05;

    font-weight:
        800;

    letter-spacing:
        -.045em;

    opacity:
        0;

    transform:
        translateY(15px);

    animation:
        textAppear .8s ease forwards;

    animation-delay:
        .5s;
}


.title span {

    color:
        var(--tiffany);
}


/* =========================================================
   ПОДЗАГОЛОВОК
========================================================= */

.subtitle {

    margin-top:
        13px;

    color:
        var(--muted);

    font-size:
        14px;

    line-height:
        1.5;

    max-width:
        380px;

    opacity:
        0;

    transform:
        translateY(15px);

    animation:
        textAppear .8s ease forwards;

    animation-delay:
        .65s;
}


@keyframes textAppear {

    to {

        opacity:
            1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   КНОПКИ
========================================================= */

.buttons {

    width:
        100%;

    margin-top:
        30px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        10px;

    opacity:
        0;

    transform:
        translateY(20px);

    animation:
        buttonsAppear .8s ease forwards;

    animation-delay:
        .8s;
}


@keyframes buttonsAppear {

    to {

        opacity:
            1;

        transform:
            translateY(0);
    }
}


.button {

    position:
        relative;

    width:
        100%;

    min-height:
        58px;

    padding:
        0 22px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        15px;

    border:
        1px solid var(--border);

    background:
        var(--button-dark);

    backdrop-filter:
        blur(12px);

    color:
        white;

    font-size:
        14px;

    font-weight:
        700;

    text-decoration:
        none;

    overflow:
        hidden;

    transition:

        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}



/* =========================================================
   ИКОНКИ В КНОПКАХ
========================================================= */

.social-button {
    gap: 10px;
}

.button-icon {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    display: block;
    color: currentColor;
    transition: transform .25s ease, opacity .25s ease;
}

.social-button:hover .button-icon {
    transform: scale(1.08);
}

/* =========================================================
   БИРЮЗОВЫЕ КНОПКИ
========================================================= */

.button.primary {

    background:
        var(--tiffany);

    color:
        #03100d;

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 30px
        rgba(67,218,193,.12);
}


.button:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--tiffany);

    box-shadow:
        0 8px 25px
        rgba(67,218,193,.10);
}


.button.primary:hover {

    background:
        #00eaff;

    box-shadow:
        0 10px 35px
        rgba(67,218,193,.22);
}


/* =========================================================
   МАЛЕНЬКАЯ ПОДПИСЬ
========================================================= */

.small {

    margin-top:
        22px;

    color:
        #606b68;

    font-size:
        10px;

    letter-spacing:
        .16em;

    text-transform:
        uppercase;

    opacity:
        0;

    animation:
        fadeIn 1s ease forwards;

    animation-delay:
        1.1s;
}


@keyframes fadeIn {

    to {

        opacity:
            1;
    }
}


/* =========================================================
   ONLINE
========================================================= */

.status {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    margin-top:
        25px;

    color:
        #37ff00;

    font-size:
        10px;

    letter-spacing:
        .12em;

    text-transform:
        uppercase;
}


.status-dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #37ff00;

    box-shadow:
        0 0 12px
        #37ff00;

    animation:
        pulse 2s infinite;
}


@keyframes pulse {

    0%, 100% {

        opacity:
            .5;

        transform:
            scale(.8);
    }

    50% {

        opacity:
            1;

        transform:
            scale(1);
    }
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top:
        auto;

    padding-top:
        35px;

    color:
        #464f4d;

    font-size:
        9px;

    letter-spacing:
        .16em;

    text-transform:
        uppercase;
}


/* =========================================================
   МОБИЛЬНЫЕ
========================================================= */

@media (max-width: 500px) {

    .card {

        width:

        padding:

    }

        font-size:
            27px;
    }


    .subtitle {

        font-size:
            13px;
    }


    .button {

        min-height:
            56px;

        border-radius:
            14px;
    }

}

</style>

<script>

/* =========================================================
   ПЛАВНЫЙ ПЕРЕХОД НА ДРУГУЮ СТРАНИЦУ
========================================================= */

document
    .querySelectorAll(".page-link")
    .forEach(link => {

        link.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                const url =
                    this.href;

                document.body
                    .classList
                    .add("page-leaving");

                setTimeout(
                    () => {

                        window.location.assign(
                            url
                        );

                    },
                    500
                );

            }
        );

    });

/* =========================================================
   КНОПКА "НАШИ РАБОТЫ"
========================================================= */

function openWorks(event) {

    event.preventDefault();

    alert(
        "Раздел «Наши работы» скоро будет доступен."
    );

}

</script>

<script>

/* =========================================================
   ВОССТАНОВЛЕНИЕ ГЛАВНОЙ ПО КНОПКЕ "НАЗАД"
========================================================= */

window.addEventListener(
    "pageshow",
    function(event) {

        /*
           Срабатываем только тогда, когда
           браузер восстановил index.html
           из истории.
        */

        if (event.persisted) {

            document.body.classList.remove(
                "page-leaving"
            );

            document.body.style.animation = "none";

            document.body.style.transition = "none";

            document.body.style.opacity = "0";

            document.body.style.transform =
                "translateY(10px)";

            /*
               Применяем начальное состояние.
            */

            void document.body.offsetHeight;

            /*
               Запускаем плавное появление.
            */

            document.body.style.transition =
                "opacity .6s ease, transform .6s ease";

            requestAnimationFrame(
                function() {

                    document.body.style.opacity = "1";

                    document.body.style.transform =
                        "translateY(0)";

                }
            );

        }

    }
);

</script>
